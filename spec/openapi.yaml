  /hooks/useGeminiLive:
    get:
      summary: "Real-time bidirectional streaming audio, text, and hardware tool execution with Gemini 3.8 Multimodal Live API."
      description: |
  Streams live bidirectional voice and text with Gemini in the cloud over WebSockets, executing real-time hardware diagnostics and actions with low-latency audio duplexing.
  
  Establishes a persistent full-duplex WebSocket connection to the Gemini Multimodal Live API. Streams base64-encoded PCM audio chunks from device microphones, receives low-latency synthesized speech responses, exposes live extended thinking thought streams, and intercepts model tool calls to execute device hardware actuators and sensors with zero round-trip delay.
      operationId: get_useGeminiLive
      tags:
        - neural-ai
      parameters:
        - name: config
          in: query
          description: "Configuration options for model name, voice profile ('Aoede', 'Puck', etc.), system instruction, thinking budget, and hardware tool binding."
          required: false
          schema:
            $ref: "#/components/schemas/GeminiLiveConfig"
      responses:
