    useSystemLoadTelemetry:
      type: object
      description: |
  Whole-system CPU, GPU and TPU load, from kernel counters an app cannot read itself.

  Android denies apps /proc/stat, /proc/pressure and the GPU and Edge TPU trace events, so whole-system load cannot be measured from inside an app. The PixelKit system-metrics daemon runs as the adb shell user (uid 2000), reads those kernel counters over a rolling one to two second window and serves them as JSON on 127.0.0.1:11081. The hook polls /metrics every two seconds with an 800 ms timeout and validates the response with parseSystemMetrics, which throws naming the offending field when the shape is wrong. CPU utilisation is the non-idle share of /proc/stat jiffies over the window, with iowait counted as idle, overall and per core. GPU utilisation is the summed total_active_duration_ns of the power/gpu_work_period tracepoint over every uid divided by the window, so it is derived from raw trace events; the GPU clock comes from power/gpu_frequency and memory from dumpsys gpu, with the busiest uids listed. TPU utilisation is reported only when the daemon decodes real edgetpu command_start and command_end events; the shell user cannot enable those trace events directly, so on a device where none are observed tpuSource is 'unavailable' and tpuError says why. A section the daemon cannot read, a daemon that is not running, and a sample older than ten seconds all give null values with a stated reason, never a default. useGPU and useCPU are unchanged: they keep reporting what an app can measure about itself.
      properties:
        isDaemonConnected:
          type: boolean
          description: True when the daemon answered the last poll with a response that parsed. False means every value below is null and error says why.
        windowMs:
          anyOf:
            - type: number
            - type: null
          description: "Length of the measurement window the percentages refer to, in milliseconds. Null without a current sample."
        sampledAtMs:
          anyOf:
            - type: number
            - type: null
          description: "Daemon wall-clock time, in epoch milliseconds, when the current window completed."
        daemonVersion:
          anyOf:
            - type: string
            - type: null
          description: Version string the daemon reported. Null until it has answered.
        cpuUtilizationPercent:
          anyOf:
            - type: number
            - type: null
          description: "Whole-system CPU use, 0 to 100, from /proc/stat jiffies over windowMs (iowait counts as idle). Null when unavailable."
        cpuPerCorePercent:
          type: array
          items:
            $ref: "#/components/schemas/numbernull"
          description: "Use of each core, 0 to 100, in cpuN order. An entry is null when that core accumulated no jiffies in the window. Empty when unavailable."
        cpuSource:
          type: string
          enum:
            - hardware
            - derived
            - unavailable
          description: "'hardware' when /proc/stat was read, 'unavailable' otherwise."
        cpuError:
          anyOf:
            - type: string
            - type: null
          description: "Why the CPU values are null, or null when they were read."
        gpuUtilizationPercent:
          anyOf:
            - type: number
            - type: null
          description: "GPU active time over windowMs, 0 to 100, summed from the power/gpu_work_period tracepoint across all uids. Null when unavailable."
        gpuFrequencyHz:
          anyOf:
            - type: number
            - type: null
          description: Current GPU clock in hertz. Null when it could not be read.
        gpuMemoryUsedMB:
          anyOf:
            - type: number
            - type: null
          description: "System-wide GPU memory in MiB, from the Global total line of dumpsys gpu. Null when it could not be read."
        gpuTopProcesses:
          type: array
          items:
            type: object
            description: "{ uid: number, activePercent: number }"
          description: "The uids that kept the GPU busiest in the window, highest first. Uids, not package names; resolve them with the package manager if you need a label. Empty when unavailable."
        gpuSource:
          type: string
          enum:
            - hardware
            - derived
            - unavailable
          description: "'derived' when utilisation is summed from raw trace events, 'hardware' for a directly read value, 'unavailable' otherwise."
        gpuError:
          anyOf:
            - type: string
            - type: null
          description: "Why some or all GPU values are null, or null when everything was read."
        tpuUtilizationPercent:
          anyOf:
            - type: number
            - type: null
          description: "Edge TPU busy share over windowMs, 0 to 100. Null unless real edgetpu command_start/command_end events were decoded."
        tpuPowerState:
          anyOf:
            - type: string
            - type: null
          description: Edge TPU power state from edgetpu_power_state events. Null when none were observed.
        tpuSource:
          type: string
          enum:
            - hardware
            - derived
            - unavailable
          description: "'hardware' only when real edgetpu events were observed, otherwise 'unavailable'."
        tpuError:
          anyOf:
            - type: string
            - type: null
          description: "Why the TPU values are null, or null when real events were observed."
        error:
          anyOf:
            - type: string
            - type: null
          description: "Latest failure or the reason no current data is returned (daemon not running, unusable response, stale sample, every section unavailable). Failures are also logged and counted."
        source:
          type: string
          enum:
            - hardware
            - derived
            - unavailable
          description: "Where the numbers came from. 'hardware' or 'derived' while the daemon supplies at least one section, 'unavailable' otherwise. There is no 'simulated' value."
      required:
        - source
    useTPUTelemetry:
      type: object
      description: |
  Whether on-device AI host packages are visible and what the hook actually executed.

  AICore hosts Gemini Nano and the TPU is reached via AICore or LiteRT. The hook reports package visibility, not model readiness or hardware usage. Unreadable package state is null. Without a benchmark there is no active delegate, so activeDelegate is null rather than claiming NPU use. AICore and Private Compute Services versions come from PackageManager, which needs a <queries> entry. Inference timings stay null here; measured model latency lives in useGeminiNano. benchmarkTPU is a JavaScript matrix multiply explicitly labelled CPU fallback.
      properties:
        aicoreInstalled:
          anyOf:
            - type: boolean
            - type: null
          description: "Whether AICore is visible through PackageManager, or null before detection or when it fails; not proof of model availability."
        aicoreVersion:
          anyOf:
            - type: string
            - type: null
          description: Installed AICore build. Useful when a model feature depends on a minimum version.
        privateComputeServicesVersion:
          anyOf:
            - type: string
            - type: null
          description: Version of the service that delivers model weights privately.
        hasNpuFeature:
          anyOf:
            - type: boolean
            - type: null
          description: "Whether the device declares a neural processing unit feature. False on this Pixel, which does not declare it."
        activeDelegate:
          anyOf:
            - type: string
              enum:
                - CPU Fallback
            - type: null
          description: "Null until the CPU-only benchmark runs, then CPU Fallback. Never a claim of current TPU activity."
        isHardwareAccelerated:
          type: boolean
          description: Always false here. This hook runs nothing on the TPU.
        lastInferenceLatencyMs:
          anyOf:
            - type: number
            - type: null
          description: Always null by design. Use useGeminiNano for real on-device latency.
        cpuFallbackLatencyMs:
          anyOf:
            - type: number
            - type: null
          description: "Duration of the last JS matrix multiplication, in milliseconds."
        isBenchmarking:
          type: boolean
          description: True while the fallback benchmark runs.
        error:
          anyOf:
            - type: string
            - type: null
          description: "Latest package or feature detection failure, if any."
        source:
          type: string
          enum:
            - hardware
            - derived
            - unavailable
          description: "'hardware' when the AICore package is installed and visible; 'unavailable' when it is not installed, not visible to this app, or the native module is absent. There is no 'simulated' value."
        throughputTokensPerSec:
          anyOf:
            - type: number
            - type: null
          description: "Always `null` here. See `useGeminiNano().lastDecodeTokensPerSec`."
        memoryFootprintMB:
          anyOf:
            - type: number
            - type: null
          description: "Always `null`: AICore does not report model memory to apps."
      required:
        - source
    useTPU_benchmarkTPU_Request:
      type: object
      description: Request payload for benchmarkTPU on useTPU.
      properties:{}
    useTPU_benchmarkTPU_Response:
      type: object
      description: Response payload for benchmarkTPU on useTPU.
      properties:
        success:
          type: boolean
          description: Whether the hardware accepted the command.
        output:
          description: "Resolves with { activeDelegate: \"CPU Fallback\", isHardwareAccelerated: false, lastInferenceLatencyMs, throughputTokensPerSec: null, memoryFootprintMB: null }. Label it as a CPU number wherever you show it."
        error:
          anyOf:
            - type: string
            - type: null
          description: Error message if failed.
        source:
          $ref: "#/components/schemas/TelemetrySource"
      required:
        - success
        - source
    useThermometerTelemetry:
      type: object
      description: |
  Discovery of the non-contact infrared temperature sensor on Google Pixel Pro hardware; temperatures stay null until a verified decoder exists.

  The native module asks Android SensorManager for a sensor whose type string contains object_temperature or mlx90632, or whose name contains Thermometer or MLX90632, and reports its name in sensorName. PixelKit has no verified decoder for that sensor's samples (unit and channel layout), so surfaceTemperatureC, surfaceTemperatureF and ambientTemperatureC are null and error states which sensor was found and why nothing is read. There is no emissivity or measurement-mode setting: nothing downstream of the sensor would apply it. Nothing is estimated or simulated.
      properties:
        isSupported:
          type: boolean
          description: Whether SensorManager lists a far-infrared temperature sensor on this device.
        surfaceTemperatureC:
          anyOf:
