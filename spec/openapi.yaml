        surfaceTemperatureF:
          anyOf:
            - type: number
            - type: null
          description: Surface temperature in degrees Fahrenheit (°F); null because no decoder exists.
        ambientTemperatureC:
          anyOf:
            - type: number
            - type: null
          description: Sensor die / ambient temperature in degrees Celsius (°C); null because no decoder exists.
        sensorName:
          anyOf:
            - type: string
            - type: null
          description: "Name SensorManager gives the sensor, or null when none was found."
        error:
          anyOf:
            - type: string
            - type: null
          description: "Why temperatures are null: the sensor was found but is not decoded, no sensor is listed, or the probe failed."
        source:
          $ref: "#/components/schemas/TelemetrySource"
          description: "'hardware' when a temperature was read, otherwise 'unavailable'."
