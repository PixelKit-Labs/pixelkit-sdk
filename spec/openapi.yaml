        isConnected:
          type: boolean
          description: "Whether a usable internet route exists, not merely an attached interface."
        isMetered:
          anyOf:
            - type: boolean
            - type: null
          description: Whether the active network is metered (lacks NET_CAPABILITY_NOT_METERED). Null before the first read or when Android does not report it. Gate large transfers on it.
        isAirplaneMode:
          anyOf:
            - type: boolean
            - type: null
          description: Whether airplane mode is on. Null before the first read or when the read failed.
        hasRead:
          type: boolean
          description: "Whether a read has completed. Before it, the values above are defaults."
        isChecking:
          type: boolean
          description: "`true` while a check is running."
        error:
          anyOf:
