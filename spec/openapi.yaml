    useWifi7MLOTelemetry:
      type: object
      description: |
  Wi-Fi 7 (802.11be) Multi-Link Operation links: band, channel, RSSI, link speeds and state.

  Reads WifiInfo.getAffiliatedMloLinks() (all links of the access point multi-link device) and getAssociatedMloLinks() (the links this station is associated to), Android 14+ (API 34+). Each link carries band (MloLink.getBand(): 2.4GHz, 5GHz, 6GHz, 60GHz or null), channel, rssi, txLinkSpeedMbps and rxLinkSpeedMbps (null when the platform reports an unknown value) and state (MloLink.getState(): unassociated, idle, active, or invalid). The platform exposes no per-link channel width. isMloActive is true when the station is associated to more than one link. aggregateSpeedMbps is the sum of txLinkSpeedMbps (transmit direction only) over the associated links, not a PHY capacity figure; it is null when not multi-link or when no link reported a speed. Reports inactive with an empty links array when the connected access point is not a multi-link device.
      properties:
        isSupported:
          type: boolean
          description: Whether this app could query MLO links (Android 14+ and the query did not throw). Not a hardware capability flag.
        isMloActive:
          type: boolean
          description: Whether the station is associated to more than one link.
        links:
          type: array
          items:
            $ref: "#/components/schemas/MloLinkInfo"
          description: "Links of the access point multi-link device with band, channel, RSSI and link speeds; each link's state says whether this station is associated to it."
        aggregateSpeedMbps:
          anyOf:
            - type: number
            - type: null
          description: "Sum of txLinkSpeedMbps over the associated links (transmit direction only), or null when not multi-link or no link reported a speed."
        error:
          anyOf:
            - type: string
            - type: null
          description: Error message if Wi-Fi link inspection failed.
        source:
          $ref: "#/components/schemas/TelemetrySource"
          description: "Data provenance: 'hardware' or 'unavailable'."
      required:
        - source
    useWifi7MLO_refresh_Request:
      type: object
      description: Request payload for refresh on useWifi7MLO.
      properties:{}
    useWifi7MLO_refresh_Response:
      type: object
      description: Response payload for refresh on useWifi7MLO.
      properties:
        success:
          type: boolean
          description: Whether the hardware accepted the command.
        output:
          description: Result description
        error:
          anyOf:
            - type: string
            - type: null
          description: Error message if failed.
        source:
          $ref: "#/components/schemas/TelemetrySource"
      required:
        - success
        - source
    useWifiRTTTelemetry:
      type: object
      description: |
  Fine Timing Measurement (FTM / 802.11mc) distance to Wi-Fi access points.

  startRanging(bssids) runs one real android.net.wifi.rtt.WifiRttManager.startRanging round and waits for the platform's callback. Each BSSID must match an 802.11mc responder in the latest Wi-Fi scan results (WifiManager.getScanResults); BSSIDs that cannot be ranged are never invented into results and are listed in unresolvedBssids with a reason (invalid_bssid, not_in_scan_results, not_80211mc_responder, exceeds_max_peers_N, permission_denied, rtt_unavailable, ranging_timeout, ranging_failed, no_result_returned). Each entry of rangingResults is one access point's RangingResult: status 0 is a measurement, and only then are distanceMm, distanceStdDevMm, rssi and the measurement counters set (they are null for status 1 fail and 2 responder without 802.11mc). When the whole request fails, rangingResults is empty and error carries the onRangingFailure code. Needs ACCESS_FINE_LOCATION, plus NEARBY_WIFI_DEVICES on Android 13+, declared and granted by the app; without them error starts with permission_denied.
      properties:
        isSupported:
          type: boolean
          description: Whether the device hardware features the Wi-Fi RTT ranging subsystem.
        isAvailable:
          type: boolean
          description: Whether the Wi-Fi RTT ranging service is currently available (Wi-Fi and location on).
        isRanging:
          type: boolean
          description: Whether a ranging round is in progress.
        rangingResults:
          type: array
          items:
            $ref: "#/components/schemas/WifiRttResult"
          description: "Per-AP results of the last round: `bssid`, `status`, `statusName`, `distanceMm`, `distanceStdDevMm`, `rssi`, `numAttemptedMeasurements`, `numSuccessfulMeasurements`, `timestampMs`. Distance, deviation, RSSI and counters are null unless `status` is 0."
        unresolvedBssids:
          type: array
          items:
            $ref: "#/components/schemas/WifiRttUnresolvedBssid"
          description: "BSSIDs of the last request that produced no measurement, each as `{ bssid, reason }`."
        error:
          anyOf:
            - type: string
            - type: null
          description: "Why probing or the last ranging round failed (missing permission, RTT unavailable, timeout, onRangingFailure code), or null."
        source:
          $ref: "#/components/schemas/TelemetrySource"
          description: "Data provenance: 'hardware' or 'unavailable'."
      required:
        - source
    useWifiRTT_startRanging_Request:
      type: object
      description: Request payload for startRanging on useWifiRTT.
      properties:{}
    useWifiRTT_startRanging_Response:
      type: object
      description: Response payload for startRanging on useWifiRTT.
      properties:
        success:
          type: boolean
          description: Whether the hardware accepted the command.
        output:
          description: Resolves the per-AP results. BSSIDs that were not ranged are in unresolvedBssids with the reason; an empty array with error set means the whole request failed.
        error:
          anyOf:
            - type: string
            - type: null
          description: Error message if failed.
        source:
          $ref: "#/components/schemas/TelemetrySource"
      required:
        - success
        - source
