  /hooks/useSpeechAI:
    get:
      summary: "Turning speech into text, on the device or in the cloud."
      description: |
  Records the user talking and returns what they said. It can use the phone's own on-device recogniser, or send a recorded clip to Gemini. On-device keeps audio on the phone and streams partial text; cloud handles harder audio and needs an API key.

  In 'on-device' mode the native module drives Android's SpeechRecognizer with the on-device recogniser (API 31+, SpeechRecognizer.isOnDeviceRecognitionAvailable) and emits partial results as the user speaks; it never silently switches to the default or cloud recogniser, and fails with the reason in error when the on-device one is unavailable. In 'cloud' mode the clip is recorded through useAudio at 16 kHz mono on the voice_recognition source, which applies the platform noise suppression, and sent to Gemini audio understanding. Neither path fabricates a transcript: without a key, cloud mode keeps the recording and returns an error.
