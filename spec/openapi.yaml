  /hooks/usePlayIntegrity:
    get:
      summary: Hardware security feature flags and Android Keystore key attestation. No Play Integrity verdict is produced.
      description: |
  Reports which hardware keystore features the device declares and whether Google Play Services is installed, and can generate an attested key and return its real certificate chain. It does not call the Play Integrity API and does not say whether the device is rooted.

  Reads the android.hardware.strongbox_keystore, android.hardware.hardware_keystore (FeatureInfo.version), android.hardware.keystore.app_attest_key and android.hardware.security.model.compatible system features and whether com.google.android.gms is installed. requestAttestation generates an EC key with an attestation challenge (StrongBox when the device declares it, with a fallback to the default keystore), reads KeyInfo.getSecurityLevel() (API 31+), and returns the certificate chain (base64, leaf first), its length, the leaf subject and issuer, and the challenge bytes actually used (generated when none is passed). The chain is returned as produced by the Keystore: this hook does not verify it. Verify it on a server against the challenge and Google's attestation roots. No Play Integrity API call is made and no integrity verdict is produced.
      operationId: get_usePlayIntegrity
      tags:
        - radios-security
      responses:
        200:
          description: Current telemetry reading from usePlayIntegrity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/usePlayIntegrityTelemetry"
  /hooks/usePlayIntegrity/actions/requestAttestation:
    post:
      summary: Invoke requestAttestation (usePlayIntegrity)
      description: "Generates an attested EC key and returns the certificate chain (base64), the key's security level from KeyInfo (null when unreadable) and the challenge used. Resolves null on failure with the reason in error."
      operationId: usePlayIntegrity_requestAttestation
      tags:
        - radios-security
      responses:
        200:
          description: Result of invoking requestAttestation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/usePlayIntegrity_requestAttestation_Response"
  /hooks/usePlayIntegrity/actions/refresh:
    post:
      summary: Invoke refresh (usePlayIntegrity)
      description: Re-reads the device security features.
      operationId: usePlayIntegrity_refresh
      tags:
        - radios-security
      responses:
        200:
          description: Result of invoking refresh.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/usePlayIntegrity_refresh_Response"
  /hooks/usePrivateSpace:
    get:
      summary: "Whether the app process runs inside Android 15+'s Private Space profile. Existence of the profile is not readable from outside it."
      description: |
  Tells you whether this app instance runs inside the Private Space profile. Android hides the Private Space from other apps and has no public auto-lock setting, so what cannot be read is null and reason says why.

  A process outside any user profile (UserManager.isProfile() is false) is reported as not inside Private Space. Inside a profile, the user type is read through LauncherApps.getLauncherUserInfo(Process.myUserHandle()) and compared with UserManager.USER_TYPE_PROFILE_PRIVATE (API 35+); when that read is refused isInsidePrivateSpace is null. Android does not list the Private Space profile to third-party apps, so isPrivateSpaceConfigured is true only when the app itself runs inside it and null otherwise. No public API exposes the auto-lock setting, so it is not reported.
      operationId: get_usePrivateSpace
      tags:
        - radios-security
      responses:
        200:
          description: Current telemetry reading from usePrivateSpace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/usePrivateSpaceTelemetry"
  /hooks/usePrivateSpace/actions/refresh:
    post:
      summary: Invoke refresh (usePrivateSpace)
      description: Re-reads the user profile type.
      operationId: usePrivateSpace_refresh
      tags:
        - radios-security
      responses:
        200:
          description: Result of invoking refresh.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/usePrivateSpace_refresh_Response"
  /hooks/useRadios:
    get:
      summary: Every radio subsystem in one read.
      description: |
  A single snapshot of all the wireless hardware: NFC, Bluetooth, ultra-wideband, Wi-Fi precise ranging and satellite messaging. Use this for a status overview instead of calling four separate hooks.

  One native call gathers state from NfcAdapter, BluetoothAdapter, UwbManager (reflection), WifiRttManager and PackageManager features, refreshed every five seconds. Values that Android does not let the app read are null rather than guessed: uwb.enabled (read through UwbManager.isUwbEnabled() by reflection) and thread.serviceFound (a hidden ServiceManager lookup). Bonded device names are null when unnamed or when BLUETOOTH_CONNECT is not granted. Until the first read completes the returned values are all-false defaults and source is 'unavailable'; source becomes 'hardware' after the first successful read, and a later success clears error. It overlaps with useNFC, useBLE and useUWB on purpose: those add per-radio actions, this one is purely for reading state.
      operationId: get_useRadios
      tags:
        - radios-security
      responses:
        200:
          description: Current telemetry reading from useRadios.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useRadiosTelemetry"
  /hooks/useRadios/actions/refresh:
    post:
      summary: Invoke refresh (useRadios)
      description: |
  Forces an immediate re-read instead of waiting for the next five-second poll.

  **Output Contract**: Returns nothing; the nfc, bluetooth, uwb, wifiRtt, thread and satellite blocks update. Call it after sending the user to Settings.
      operationId: useRadios_refresh
      tags:
        - radios-security
      responses:
        200:
          description: Result of invoking refresh.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useRadios_refresh_Response"
  /hooks/useSatelliteNTN:
    get:
      summary: "Whether the device declares satellite messaging support. Connection state, carrier, signal and SOS readiness are not readable through Android's public API and are null."
      description: |
  Tells you whether the phone declares satellite messaging hardware support. Android does not let apps read the satellite connection, carrier, signal strength or SOS readiness, so those fields stay null and unreadReason says why.

  Reads the android.hardware.telephony.satellite system feature through PackageManager. Android 36's public SatelliteManager only offers register/unregisterStateChangeListener with an enabled-state callback, so there is no public read for connection state, carrier, signal bars, pointing data or emergency readiness. Those fields (connectionState, carrier, signalQualityBars, pointingGuidance, emergencyServicesReady) are always null and unreadReason states the reason.
      operationId: get_useSatelliteNTN
      tags:
        - radios-security
      responses:
        200:
          description: Current telemetry reading from useSatelliteNTN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useSatelliteNTNTelemetry"
  /hooks/useSatelliteNTN/actions/refresh:
    post:
      summary: Invoke refresh (useSatelliteNTN)
      description: Re-reads the satellite system feature.
      operationId: useSatelliteNTN_refresh
      tags:
        - radios-security
      responses:
        200:
          description: Result of invoking refresh.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useSatelliteNTN_refresh_Response"
  /hooks/useSecurity:
    get:
      summary: "Encrypted storage for secrets, backed by hardware."
      description: |
  Where API keys and tokens belong. Values are encrypted with a key the operating system holds in secure hardware, so they are not readable from app storage. Never put a secret anywhere else.

  Wraps expo-secure-store, which encrypts values using a key held in the Android Keystore and, on devices that have it, StrongBox. Whether this device actually has StrongBox is verified separately by useCapabilities().hasStrongBox. Android 17 does have post-quantum key types, but SecureStore does not use them, so isPostQuantumProtected is false rather than implying protection that is not there.
      operationId: get_useSecurity
      tags:
        - radios-security
      responses:
        200:
          description: Current telemetry reading from useSecurity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useSecurityTelemetry"
