  /hooks/useHaptics:
    get:
      summary: "Vibration, from simple taps to custom-shaped waveforms."
      description: |
  Makes the phone buzz. Standard patterns cover ordinary taps and confirmations. On devices where Android reports envelope support you can also design your own vibration shape, rising and falling in intensity, which is how you make a distinctive feel rather than a generic buzz.

  Standard patterns come from expo-haptics. Beyond that, the native module reports the vibrator's capabilities: whether amplitude can be varied, its resonant frequency (null when the platform does not report it), and which composition primitives it supports. Android 16 envelope effects are built with BasicEnvelopeBuilder from intensity and sharpness control points and must finish at zero intensity; they play only where Vibrator.areEnvelopeEffectsSupported() is true (check envelopeSupported). source reflects the capability read, not the expo-haptics calls.
      operationId: get_useHaptics
      tags:
        - sensors-actuators
      responses:
