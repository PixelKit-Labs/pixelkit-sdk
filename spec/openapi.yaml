    useAppFunctionsTelemetry:
      type: object
      description: |
  In-process registry and runner for device actions, plus a probe of the Android AppFunctions service.

  isSupported is an API-level check (36 and above); serviceFound and serviceName come from a lookup of the Android app_function system service. The hook keeps an in-process registry: built-in actions ('check_phone_thermals', 'purge_memory_cache', 'get_device_silicon_info') and custom schemas and handlers added with registerFunction are listed in functions and run by executeFunction, but none of them is registered with the system service, so Gemini and other assistants cannot see them (that needs a native AppFunctionService in your app). An id that is neither custom nor built in is run through the native registry (PixelNative.getAppFunctions: triggerHapticEffect, setTorchLevel, getSiliconStatus, scanNearbyRadios); executeFunction resolves success false with the native message when the effect did not happen (for example an unsupported haptic primitive) and with an unknown-id error for any other id. source is 'hardware' only when the system service was found.
      properties:
        isSupported:
          type: boolean
          description: "Whether the device runs Android 16 (API 36) or later. An API-level check, not a service probe."
        serviceFound:
          type: boolean
          description: Whether the android.app.appfunctions.IAppFunctionManager system service is active and discoverable on device.
        apiLevel:
          anyOf:
            - type: number
            - type: null
          description: Android platform API level reported by the device.
        serviceName:
          anyOf:
            - type: string
            - type: null
          description: "System service name ('app_function'); null when the service was not found."
        functions:
          type: array
          items:
            $ref: "#/components/schemas/AppFunctionSchema"
          description: "The hook's built-in schemas plus custom ones registered through this hook. An in-process list, not the system registry."
        error:
          anyOf:
            - type: string
            - type: null
          description: Latest execution or system service error.
        source:
          type: string
          enum:
            - hardware
            - derived
            - unavailable
          description: "Provenance of AppFunctions state. Real hardware with active app_function service reports 'hardware'."
      required:
        - source
