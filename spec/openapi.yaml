    useHapticsTelemetry:
      type: object
      description: |
  Vibration, from simple taps to custom-shaped waveforms.

  Standard patterns come from expo-haptics. Beyond that, the native module reports the vibrator's capabilities: whether amplitude can be varied, its resonant frequency (null when the platform does not report it), and which composition primitives it supports. Android 16 envelope effects are built with BasicEnvelopeBuilder from intensity and sharpness control points and must finish at zero intensity; they play only where Vibrator.areEnvelopeEffectsSupported() is true (check envelopeSupported). source reflects the capability read, not the expo-haptics calls.
      properties:
        hasAmplitudeControl:
          anyOf:
            - type: boolean
            - type: null
          description: Whether vibration strength can be varied rather than just on and off.
        envelopeSupported:
          type: boolean
          description: Whether custom envelope waveforms can be played.
        resonantFrequencyHz:
          anyOf:
            - type: number
            - type: null
          description: "The actuator's resonant frequency in Hz as the vibrator reports it, or null when not reported. Effects near it feel strongest."
        supportedPrimitives:
          type: array
          items:
            type: string
          description: "Composition building blocks the hardware provides, such as click, tick, thud and rise."
        source:
          type: string
          enum:
            - hardware
            - derived
            - unavailable
          description: "'hardware' once the vibrator capability read succeeded, 'unavailable' before it, on web, or without the native module."
      required:
        - source
