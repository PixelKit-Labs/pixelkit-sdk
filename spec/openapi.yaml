    useKeyAgreementTelemetry:
      type: object
      description: |
  ECDH session key derivation with a private key generated in the Android Keystore; the achieved security level is read from KeyInfo.

  Uses AndroidKeyStore and the Java Cryptography Architecture. Generates an EC keypair with PURPOSE_AGREE_KEY (the Keystore default curve) and derives an ECDH shared secret against an external peer public key. When preferStrongBox is true and the device declares android.hardware.strongbox_keystore, StrongBox is requested; the achieved level is read with KeyInfo.getSecurityLevel() (API 31+) and returned as securityLevel (STRONGBOX, TRUSTED_ENVIRONMENT, SOFTWARE, UNKNOWN_SECURE), or null with securityLevelReason when it cannot be read or generation failed.
      properties:
        isStrongBoxSupported:
          type: boolean
          description: Whether the device declares the android.hardware.strongbox_keystore feature.
        error:
          anyOf:
            - type: string
            - type: null
          description: Latest error message if keypair generation or secret derivation failed.
        source:
          $ref: "#/components/schemas/TelemetrySource"
          description: "Data provenance: 'hardware' or 'unavailable'."
      required:
        - source
    useKeyAgreement_generateKeyPair_Request:
      type: object
      description: Request payload for generateKeyPair on useKeyAgreement.
