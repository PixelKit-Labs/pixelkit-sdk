  Wraps the ML Kit language stack through pixel-nano: language-id, translate, smart-reply and entity-extraction. Translation models download per language pair on first use and then run offline, which is why the first call for a new pair is slower. Translation accepts only the language tags ML Kit Translate supports; any other tag rejects with E_NANO_UNSUPPORTED_LANGUAGE (surfaced in error, result null) and no other language is substituted. Smart reply takes a short conversation history and proposes replies. Entity extraction works on English text only and returns typed spans with their positions in the original string.
