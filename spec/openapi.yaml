    useVisionAITelemetry:
      type: object
      description: |
  Nine on-device vision capabilities, plus cloud scene understanding.

  The on-device half wraps the ML Kit vision models through pixel-nano and runs without a network: barcode scanning, text recognition v2, face detection with landmarks and head angles, 468-point face mesh, image labelling, object detection (single-image mode), 33-point pose detection, selfie and subject segmentation, and digital ink recognition. Face and object results have a trackingId field, but it is always null: the object detector runs in SINGLE_IMAGE_MODE and the face detector is created without tracking, so ids are not assigned across frames. The cloud half sends a captured or picked image to Gemini and asks for a description plus structured labels. Each on-device call reports its own latency.
      properties:
        selectedImageUri:
          anyOf:
            - type: string
            - type: null
          description: "Image currently loaded, from the camera or the picker."
        analysis:
          anyOf:
            - $ref: "#/components/schemas/VisionAnalysisResult"
            - type: null
          description: Cloud description and labels with latency.
        isAnalyzing:
          type: boolean
          description: True during a cloud call.
        isOnDeviceProcessing:
          type: boolean
          description: True during any local vision call.
        ocrResult:
          anyOf:
            - $ref: "#/components/schemas/TextRecognitionResult"
            - type: null
          description: Recognised text with per-block bounding boxes.
        barcodeResult:
          anyOf:
            - $ref: "#/components/schemas/BarcodeScanResult"
            - type: null
          description: Decoded barcodes with format and position.
        facesResult:
          anyOf:
            - $ref: "#/components/schemas/FaceDetectionResult"
            - type: null
          description: "Faces with head angles, smile and eye-open probabilities."
        faceMeshResult:
          anyOf:
            - $ref: "#/components/schemas/FaceMeshResult"
            - type: null
          description: 468-point mesh for close-range faces.
        labelsResult:
          anyOf:
            - $ref: "#/components/schemas/ImageLabelResult"
            - type: null
          description: Concept labels with confidence.
        objectsResult:
          anyOf:
            - $ref: "#/components/schemas/ObjectDetectionResult"
            - type: null
          description: "Detected objects with bounding boxes and labels. trackingId is always null: detection runs in single-image mode, so there is no tracking across frames."
        poseResult:
          anyOf:
            - $ref: "#/components/schemas/PoseDetectionResult"
            - type: null
          description: 33 skeletal landmarks with in-frame likelihood.
        selfieResult:
          anyOf:
            - $ref: "#/components/schemas/SelfieSegmentationResult"
            - type: null
          description: Person-versus-background mask dimensions.
        subjectResult:
          anyOf:
            - $ref: "#/components/schemas/SubjectSegmentationResult"
            - type: null
          description: Foreground subject cut-out result.
        digitalInkResult:
          anyOf:
            - $ref: "#/components/schemas/DigitalInkResult"
            - type: null
          description: Handwriting candidates from stroke input.
        error:
          anyOf:
            - type: string
            - type: null
          description: Why the last call failed.
        model:
          type: string
          description: Cloud model used for scene analysis.
        source:
          type: string
          enum:
            - hardware
            - derived
            - unavailable
          description: "'hardware' once an on-device operation has returned a result; 'unavailable' before that or when the native module is absent. There is no 'simulated' value."
        selectedImageBase64:
          anyOf:
            - type: string
            - type: null
          description: "The same image as base64, which is what the model calls consume."
      required:
        - source
