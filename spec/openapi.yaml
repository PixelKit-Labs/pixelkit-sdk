    useUWBTelemetry:
      type: object
      description: |
  Ultra-wideband radio state and real ranging sessions against a peer device.

  Chip presence (android.hardware.uwb feature), the enabled state (UwbManager.isUwbEnabled() by reflection, null when apps cannot read it) and ranging service readiness (whether the Android 16 RangingManager service exists) are queried through the native module, carrying source hardware. startRanging(config) opens a real android.ranging.RangingSession (Android 16, API 36+, RAW UWB session) with the peer described by the config: its address, the session id, and optionally the channel, preamble index and key info, all agreed with the peer out of band (BLE, NFC, QR). The call resolves true only when the platform reports the session open; otherwise it resolves false and sessionError carries a status such as needs_peer_configuration, uwb_unsupported, ranging_api_unavailable, uwb_disabled, permission_denied (android.permission.RANGING must be declared and granted by the app), session_active, invalid_parameters or open_failed. measurements holds the latest android.ranging.RangingData sample per peer (distance in meters, azimuth and elevation in degrees, each with the platform's confidence level) and stays empty until the peer answers.
      properties:
        isSupported:
          type: boolean
          description: Whether the UWB chip exists on this device.
        isEnabled:
          anyOf:
            - type: boolean
            - type: null
          description: Whether the radio is switched on in system settings; null when Android does not let apps read it.
        rangingApiSupported:
          type: boolean
          description: Whether the Android 16 android.ranging.RangingManager service exists.
        isRanging:
          type: boolean
          description: "Whether the platform holds an open ranging session. Follows the platform's session events, not the last call."
        measurements:
          type: array
          items:
            $ref: "#/components/schemas/UwbMeasurementEvent"
          description: "Latest platform sample per peer device: `deviceId`, `distanceMeters`, `azimuthDegrees`, `elevationDegrees` (null when the platform omitted them), a `*Confidence` of 'low', 'medium' or 'high' for each, `rssi` and `timestampMs`. Empty until the peer answers."
        sessionInfo:
          anyOf:
            - $ref: "#/components/schemas/UwbRangingResult"
            - type: null
          description: "Result of the last start request: `status`, `error`, `sessionId`, `serviceName`, `serviceAvailable`, `rangingFeature`, `timestampMs`."
        sessionError:
          anyOf:
            - type: string
            - type: null
          description: "Status code and reason when the last start or stop did not succeed, for example `needs_peer_configuration: peerAddress must be hex address bytes`."
        source:
          type: string
          enum:
            - hardware
            - derived
            - unavailable
          description: "Where the numbers came from. There is no 'simulated' value: a reading is real, derived from real readings, or unavailable."
        error:
          anyOf:
            - type: string
            - type: null
          description: "Latest failure message, or `null`. Failures are also logged and counted."
      required:
        - source
    useUWB_startRanging_Request:
      type: object
      description: Request payload for startRanging on useUWB.
      properties:
        config:
          $ref: "#/components/schemas/UwbRangingConfig"
          description: "`{ sessionId: number, role: 'initiator' | 'responder', localAddress: string, peerAddress: string, configId?: number (1..6, default 1), channel?: number, preambleIndex?: number, sessionKeyInfo?: string, updateRate?: 'normal' | 'infrequent' | 'frequent', slotDurationMs?: 1 | 2, angleOfArrival?: boolean }`. Addresses and keys are hex bytes (2-byte short or 8-byte extended addresses); channel and preambleIndex go together. All values must match what the peer was given."
      required:
        - config
    useUWB_startRanging_Response:
      type: object
      description: Response payload for startRanging on useUWB.
      properties:
        success:
          type: boolean
          description: Whether the hardware accepted the command.
        output:
          description: "Resolves true when the platform reported the session open; false with the status and reason in sessionError when the peer configuration is missing or invalid, the device or OS cannot range, a permission is missing, or the platform refused to open. sessionInfo is updated either way."
        error:
          anyOf:
            - type: string
            - type: null
          description: Error message if failed.
        source:
          $ref: "#/components/schemas/TelemetrySource"
      required:
        - success
        - source
    useUWB_stopRanging_Request:
      type: object
      description: Request payload for stopRanging on useUWB.
      properties:{}
    useUWB_stopRanging_Response:
      type: object
      description: Response payload for stopRanging on useUWB.
      properties:
        success:
          type: boolean
          description: Whether the hardware accepted the command.
        output:
          description: "Returns `{ wasActive, closed, sessionId, error, timestampMs }`: wasActive is false when nothing was running, and error carries a failure from the platform's stop or close. Returns null when the native module is absent."
        error:
          anyOf:
            - type: string
            - type: null
          description: Error message if failed.
        source:
          $ref: "#/components/schemas/TelemetrySource"
      required:
        - success
        - source
    useVideoTelemetry:
      type: object
      description: |
  Playing video back, with position, seeking and thumbnails.

  Wraps expo-video, the SDK 57 replacement for the removed expo-av. The hook owns the player and a screen renders VideoView with it. Position, duration, buffered position and status are polled four times a second, which is enough for a scrubber without waking the JS thread every frame. Everything reported comes from the player rather than being tracked locally, so a seek made elsewhere still shows up.
      properties:
        player:
          $ref: "#/components/schemas/VideoPlayer"
          description: "Pass to <VideoView player={player} />. The view renders nothing without it."
        hasSource:
          type: boolean
          description: Whether a source has been loaded.
        isPlaying:
          type: boolean
          description: Whether playback is running.
        positionSeconds:
          type: number
          description: Seconds into the clip. Drives a scrubber.
        durationSeconds:
          type: number
          description: Total length. 0 until the source reports it.
        bufferedSeconds:
          type: number
          description: "How far ahead the player has buffered, which matters for a remote source."
        status:
          type: string
          description: "Player status, for example loading, readyToPlay or error."
        isMuted:
          type: boolean
          description: Whether audio is muted.
        isLooping:
          type: boolean
          description: Whether the clip restarts at the end.
        playbackRate:
