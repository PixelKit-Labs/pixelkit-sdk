  /hooks/useKeyAgreement:
    get:
      summary: ECDH session key derivation with a private key generated in the Android Keystore; the achieved security level is read from KeyInfo.
      description: |
  Generates an EC keypair in the Android Keystore (StrongBox when requested and declared by the device) and derives a shared secret via ECDH. The private key stays in the Keystore. The level the key really got (StrongBox, trusted environment, software) is read back from KeyInfo and is null when it cannot be read.

  Uses AndroidKeyStore and the Java Cryptography Architecture. Generates an EC keypair with PURPOSE_AGREE_KEY (the Keystore default curve) and derives an ECDH shared secret against an external peer public key. When preferStrongBox is true and the device declares android.hardware.strongbox_keystore, StrongBox is requested; the achieved level is read with KeyInfo.getSecurityLevel() (API 31+) and returned as securityLevel (STRONGBOX, TRUSTED_ENVIRONMENT, SOFTWARE, UNKNOWN_SECURE), or null with securityLevelReason when it cannot be read or generation failed.
      operationId: get_useKeyAgreement
      tags:
        - radios-security
      responses:
        200:
          description: Current telemetry reading from useKeyAgreement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useKeyAgreementTelemetry"
  /hooks/useKeyAgreement/actions/generateKeyPair:
    post:
      summary: Invoke generateKeyPair (useKeyAgreement)
      description: "Generates an EC keypair in the Android Keystore. Resolves with publicKeyBase64 and securityLevel (null when unreadable or when generation failed, with the reason in error)."
      operationId: useKeyAgreement_generateKeyPair
      tags:
        - radios-security
      responses:
        200:
          description: Result of invoking generateKeyPair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useKeyAgreement_generateKeyPair_Response"
  /hooks/useKeyAgreement/actions/deriveSharedSecret:
    post:
      summary: Invoke deriveSharedSecret (useKeyAgreement)
      description: "Derives a shared secret via ECDH with a peer's public key. Resolves with sharedSecretBase64 (null on failure, with the reason in error)."
      operationId: useKeyAgreement_deriveSharedSecret
      tags:
        - radios-security
      responses:
        200:
          description: Result of invoking deriveSharedSecret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useKeyAgreement_deriveSharedSecret_Response"
  /hooks/useLocation:
    get:
      summary: "Position, altitude, heading and speed from expo-location."
      description: |
  Where the phone is, how accurate that is, which way it is pointing and how fast it is moving. Latitude and longitude are null until the first fix. Always check accuracy before trusting a fix, and check permission before assuming you will get one at all.

  Takes one fix from expo-location (getCurrentPositionAsync, Accuracy.Highest); it does not report which receiver or band produced it. Latitude and longitude are null until the first fix arrives, including when permission is denied. The accuracy value is the radius in metres that the platform believes the position lies within; indoors it can be tens of metres and should gate any decision made from the coordinates. Heading and speed are only meaningful while actually moving.
      operationId: get_useLocation
      tags:
        - radios-security
      responses:
        200:
          description: Current telemetry reading from useLocation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useLocationTelemetry"
  /hooks/useLocation/actions/refreshLocation:
    post:
      summary: Invoke refreshLocation (useLocation)
      description: |
  Requests permission if needed and takes a fresh highest-accuracy fix.

  **Output Contract**: Resolves true when a fix arrived, false when permission was denied or the fix failed, with the reason in error. Coordinates never reach the log.
      operationId: useLocation_refreshLocation
      tags:
        - radios-security
      responses:
        200:
          description: Result of invoking refreshLocation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useLocation_refreshLocation_Response"
  /hooks/useMediaLibrary:
    get:
      summary: "Saving captures to the gallery, and reading what is there."
      description: |
  Puts a photo or video into the user's own gallery, where it survives and other apps can see it. Without this a capture sits in the app's cache and disappears when the system needs space. Also lists recent items and can delete one.

  Wraps expo-media-library. SDK 57 uses Asset.create, Album.create, and Query; deprecated saveToLibraryAsync and createAssetAsync throw. save() requests write-only access and does not require read permission unless an album name is supplied. Read and write grants are tracked independently: permissionGranted and hasLimitedAccess describe browsing, not permission to add new media. Asset fields are async accessors flattened into a SavedMedia object; failures surface through error.
      operationId: get_useMediaLibrary
      tags:
        - system-media
      responses:
        200:
          description: Current telemetry reading from useMediaLibrary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useMediaLibraryTelemetry"
  /hooks/useMediaLibrary/actions/requestPermission:
    post:
      summary: Invoke requestPermission (useMediaLibrary)
      description: |
  Asks for read access by default, or only write access when writeOnly is true.

  **Output Contract**: Resolves true when granted. A write-only grant does not set permissionGranted or imply browsing rights; hasLimitedAccess describes read access.
      operationId: useMediaLibrary_requestPermission
      tags:
        - system-media
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/useMediaLibrary_requestPermission_Request"
      responses:
        200:
          description: Result of invoking requestPermission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useMediaLibrary_requestPermission_Response"
  /hooks/useMediaLibrary/actions/save:
    post:
      summary: Invoke save (useMediaLibrary)
      description: |
  Copies a local capture into the user media store using SDK 57 Asset.create; requests write-only permission automatically, and read permission only if selecting a named album.

  **Output Contract**: Resolves with { id, uri, filename, width, height, durationSeconds, creationTime }, or null when the grant or write fails; error explains the failure. A failed album creation after the asset is saved is reported in error without claiming that the file itself failed to save.
      operationId: useMediaLibrary_save
      tags:
        - system-media
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/useMediaLibrary_save_Request"
      responses:
        200:
          description: Result of invoking save.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useMediaLibrary_save_Response"
  /hooks/useMediaLibrary/actions/loadRecent:
    post:
      summary: Invoke loadRecent (useMediaLibrary)
      description: |
  Reads the newest items in the library, newest first.

  **Output Contract**: Resolves with the items, also written to recent. Empty array when permission was denied.
      operationId: useMediaLibrary_loadRecent
      tags:
        - system-media
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/useMediaLibrary_loadRecent_Request"
      responses:
        200:
          description: Result of invoking loadRecent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useMediaLibrary_loadRecent_Response"
  /hooks/useMediaLibrary/actions/remove:
    post:
      summary: Invoke remove (useMediaLibrary)
      description: |
  Deletes an item from the device. The system may show its own confirmation.

  **Output Contract**: Resolves true when the item was deleted, and it is dropped from recent.
      operationId: useMediaLibrary_remove
      tags:
        - system-media
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/useMediaLibrary_remove_Request"
      responses:
        200:
