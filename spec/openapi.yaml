    useSpeechTelemetry:
      type: object
      description: |
  Speaking text aloud with the voices the phone has installed.

  Wraps expo-speech for the system voice and can address an installed Android TTS service by package name without changing the phone default. Explicit-engine calls fail closed unless Android exposes an exact active-package match: PixelKit inventories and rechecks the installed package/version, resolves voice/locale identity, and rejects missing, changed, mismatched or unobservable engines before synthesis. Platform TTS, explicit Android TTS and Gemini Live audio use distinct output identities. External apps own installation and model downloads; their internal execution provider is not inferred. Speech runs require explicit trace context.
      properties:
        isSpeaking:
          type: boolean
          description: Whether the engine is talking.
        isPaused:
          type: boolean
          description: Whether speech is paused rather than stopped.
        voices:
          type: array
          items:
            $ref: "#/components/schemas/Voice"
          description: "Installed voices, each with an identifier, name, language and quality."
        speechEngines:
          type: array
          items:
            $ref: "#/components/schemas/SpeechEngineInfo"
          description: "Android TTS services installed on the device, including package label/version and external installation ownership; empty when unavailable."
        lastSpeechIdentity:
          anyOf:
            - $ref: "#/components/schemas/SpeechOutputIdentity"
            - type: null
          description: "Observed identity for the latest output. Platform TTS, explicit Android TTS and Gemini Live audio are distinct discriminated types."
        lastSynthesis:
          anyOf:
            - $ref: "#/components/schemas/SpeechSynthesisResult"
            - type: null
          description: "Latest explicit-engine terminal result with utterance identity, callback timestamps, status and redacted trace correlation."
        voice:
          anyOf:
            - type: string
            - type: null
          description: "Selected voice identifier, or null for the system default."
        rate:
          type: number
          description: Speaking speed; 1 is normal.
        pitch:
          type: number
          description: Voice pitch; 1 is normal.
        maxInputLength:
          type: number
          description: Longest string the engine accepts in one call.
        lastSpokenText:
          anyOf:
            - type: string
            - type: null
          description: Text of the most recent utterance.
        error:
          anyOf:
            - type: string
            - type: null
          description: Why the last utterance failed.
        source:
          type: string
          enum:
            - hardware
            - derived
            - unavailable
          description: "Where the numbers came from. There is no 'simulated' value: a reading is real, derived from real readings, or unavailable."
      required:
        - source
