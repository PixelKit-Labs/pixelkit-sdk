    usePrivateSpaceTelemetry:
      type: object
      description: |
  Whether the app process runs inside Android 15+'s Private Space profile. Existence of the profile is not readable from outside it.

  A process outside any user profile (UserManager.isProfile() is false) is reported as not inside Private Space. Inside a profile, the user type is read through LauncherApps.getLauncherUserInfo(Process.myUserHandle()) and compared with UserManager.USER_TYPE_PROFILE_PRIVATE (API 35+); when that read is refused isInsidePrivateSpace is null. Android does not list the Private Space profile to third-party apps, so isPrivateSpaceConfigured is true only when the app itself runs inside it and null otherwise. No public API exposes the auto-lock setting, so it is not reported.
      properties:
        isInsidePrivateSpace:
          anyOf:
            - type: boolean
            - type: null
          description: Whether the current application process runs inside the Private Space profile. False below Android 15 and outside any profile; null when it runs in a profile whose type cannot be read.
        isPrivateSpaceConfigured:
          anyOf:
            - type: boolean
            - type: null
          description: True when the app runs inside the Private Space; null otherwise because Android hides the profile from apps (false below Android 15).
        reason:
          anyOf:
            - type: string
            - type: null
          description: Why unreadable values are null; null before the first read.
        error:
          anyOf:
            - type: string
            - type: null
          description: Error message if private profile querying failed.
        source:
