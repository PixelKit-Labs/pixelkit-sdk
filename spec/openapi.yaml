    useRadiosTelemetry:
      type: object
      description: |
  Every radio subsystem in one read.

  One native call gathers state from NfcAdapter, BluetoothAdapter, UwbManager (reflection), WifiRttManager and PackageManager features, refreshed every five seconds. Values that Android does not let the app read are null rather than guessed: uwb.enabled (read through UwbManager.isUwbEnabled() by reflection) and thread.serviceFound (a hidden ServiceManager lookup). Bonded device names are null when unnamed or when BLUETOOTH_CONNECT is not granted. Until the first read completes the returned values are all-false defaults and source is 'unavailable'; source becomes 'hardware' after the first successful read, and a later success clears error. It overlaps with useNFC, useBLE and useUWB on purpose: those add per-radio actions, this one is purely for reading state.
      properties:
        nfc:
          type: object
          description: NFC controller state.
        bluetooth:
          type: object
          description: Adapter state plus paired devices and Channel Sounding support.
        uwb:
          type: object
          description: "Ultra-wideband state: the android.hardware.uwb feature, whether UwbManager reports it enabled (null when not readable by apps) and whether the Android 16 RangingManager service exists."
        wifiRtt:
          type: object
          description: "Wi-Fi round-trip-time ranging, used for indoor positioning."
        thread:
          type: object
          description: Thread 802.15.4 radio feature flag and whether a ServiceManager lookup finds the Thread network service (null when the hidden lookup is not possible).
        satellite:
          type: object
          description: Satellite and Google Satellite SOS provider system feature flags.
        source:
          type: string
          enum:
            - hardware
            - derived
            - unavailable
          description: "'hardware' after the first successful read, 'unavailable' before it or without the native module. There is no 'simulated' value: a reading is real, derived from real readings, or unavailable."
      required:
        - source
    useRadios_refresh_Request:
      type: object
      description: Request payload for refresh on useRadios.
      properties:{}
    useRadios_refresh_Response:
      type: object
      description: Response payload for refresh on useRadios.
      properties:
        success:
          type: boolean
          description: Whether the hardware accepted the command.
        output:
          description: "Returns nothing; the nfc, bluetooth, uwb, wifiRtt, thread and satellite blocks update. Call it after sending the user to Settings."
        error:
          anyOf:
            - type: string
            - type: null
          description: Error message if failed.
        source:
          $ref: "#/components/schemas/TelemetrySource"
      required:
        - success
        - source
    useSatelliteNTNTelemetry:
      type: object
      description: |
  Whether the device declares satellite messaging support. Connection state, carrier, signal and SOS readiness are not readable through Android's public API and are null.

  Reads the android.hardware.telephony.satellite system feature through PackageManager. Android 36's public SatelliteManager only offers register/unregisterStateChangeListener with an enabled-state callback, so there is no public read for connection state, carrier, signal bars, pointing data or emergency readiness. Those fields (connectionState, carrier, signalQualityBars, pointingGuidance, emergencyServicesReady) are always null and unreadReason states the reason.
      properties:
        isSupported:
          type: boolean
          description: True when the device declares the android.hardware.telephony.satellite system feature.
        connectionState:
          anyOf:
            - type: string
              enum:
                - disconnected
                - searching
                - connected
                - pointing_assist
            - type: null
          description: "Always null: Android's public API exposes no satellite connection state."
        carrier:
          anyOf:
            - type: string
            - type: null
          description: "Always null: Android's public API exposes no satellite carrier."
        signalQualityBars:
          anyOf:
            - type: number
            - type: null
          description: "Always null: Android's public API exposes no satellite signal strength."
        pointingGuidance:
          anyOf:
            - $ref: "#/components/schemas/SatelliteGuidance"
            - type: null
          description: "Always null: Android's public API exposes no satellite pointing data."
        emergencyServicesReady:
          anyOf:
            - type: boolean
            - type: null
          description: "Always null: Android's public API exposes no satellite emergency readiness."
        unreadReason:
          anyOf:
            - type: string
            - type: null
          description: Why the null fields are null; null before the first read.
        error:
          anyOf:
            - type: string
            - type: null
          description: Error message if the query failed.
        source:
          $ref: "#/components/schemas/TelemetrySource"
          description: "'hardware' when the feature flag says satellite is supported, 'unavailable' otherwise."
      required:
        - source
