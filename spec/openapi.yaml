  Opens the Live WebSocket session with the trace context and capability adapter for this session.

  **Output Contract**: Resolves with { status: 'connected' | 'unavailable' | 'error' | 'cancelled', context, reason? }. Check status before sending.
      operationId: useGeminiLive_connect
      tags:
        - neural-ai
      requestBody:
