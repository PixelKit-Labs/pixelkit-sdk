  /hooks/useUWB:
    get:
      summary: Ultra-wideband radio state and real ranging sessions against a peer device.
      description: |
  Reports whether this phone has the short-range precision radio used for precision spatial tracking and car keys, and ranges against a second UWB device whose address and channel you supply.

  Chip presence (android.hardware.uwb feature), the enabled state (UwbManager.isUwbEnabled() by reflection, null when apps cannot read it) and ranging service readiness (whether the Android 16 RangingManager service exists) are queried through the native module, carrying source hardware. startRanging(config) opens a real android.ranging.RangingSession (Android 16, API 36+, RAW UWB session) with the peer described by the config: its address, the session id, and optionally the channel, preamble index and key info, all agreed with the peer out of band (BLE, NFC, QR). The call resolves true only when the platform reports the session open; otherwise it resolves false and sessionError carries a status such as needs_peer_configuration, uwb_unsupported, ranging_api_unavailable, uwb_disabled, permission_denied (android.permission.RANGING must be declared and granted by the app), session_active, invalid_parameters or open_failed. measurements holds the latest android.ranging.RangingData sample per peer (distance in meters, azimuth and elevation in degrees, each with the platform's confidence level) and stays empty until the peer answers.
      operationId: get_useUWB
      tags:
        - pro-exclusives
      responses:
        200:
          description: Current telemetry reading from useUWB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useUWBTelemetry"
  /hooks/useUWB/actions/startRanging:
    post:
      summary: Invoke startRanging (useUWB)
      description: |
  Opens a real UWB ranging session with the peer described by config.

  **Output Contract**: Resolves true when the platform reported the session open; false with the status and reason in sessionError when the peer configuration is missing or invalid, the device or OS cannot range, a permission is missing, or the platform refused to open. sessionInfo is updated either way.
      operationId: useUWB_startRanging
      tags:
        - pro-exclusives
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/useUWB_startRanging_Request"
      responses:
        200:
          description: Result of invoking startRanging.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useUWB_startRanging_Response"
  /hooks/useUWB/actions/stopRanging:
    post:
      summary: Invoke stopRanging (useUWB)
      description: |
  Closes the running UWB ranging session.

  **Output Contract**: Returns `{ wasActive, closed, sessionId, error, timestampMs }`: wasActive is false when nothing was running, and error carries a failure from the platform's stop or close. Returns null when the native module is absent.
      operationId: useUWB_stopRanging
      tags:
        - pro-exclusives
      responses:
        200:
          description: Result of invoking stopRanging.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useUWB_stopRanging_Response"
