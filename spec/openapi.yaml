    useHealthConnectTelemetry:
      type: object
      description: |
  Health Connect availability and the device's step counter and heart rate sensors. Does not read health records.

  isAvailable and sdkStatus are inferred: the healthconnect system service (Context.HEALTHCONNECT_SERVICE, Android 14+) or the com.google.android.apps.healthdata package is present. They are not the result of HealthConnectClient.getSdkStatus(), which this SDK does not call, so no provider-update state is reported. hasStepCounter / hasHeartRateSensor and the sensor names come from the step counter system feature and SensorManager.getDefaultSensor (TYPE_STEP_COUNTER, TYPE_HEART_RATE).
      properties:
        isAvailable:
          type: boolean
          description: "Inferred: the healthconnect system service or the com.google.android.apps.healthdata package exists."
        sdkStatus:
          type: string
          enum:
            - SDK_AVAILABLE
            - SDK_UNAVAILABLE
          description: "'SDK_AVAILABLE' when isAvailable, otherwise 'SDK_UNAVAILABLE'. Not read from HealthConnectClient.getSdkStatus(); no provider-update state is reported."
        hasStepCounter:
          type: boolean
          description: Whether physical hardware step counter sensor is present.
        hasHeartRateSensor:
          type: boolean
          description: Whether hardware heart rate sensor is present.
        stepSensorName:
          anyOf:
            - type: string
            - type: null
          description: Hardware sensor name (e.g. Google Step Counter).
        heartRateSensorName:
          anyOf:
            - type: string
            - type: null
          description: Hardware heart rate sensor name.
        isFrameworkIntegrated:
          type: boolean
          description: Whether the healthconnect system service exists (Android 14+).
        error:
          anyOf:
            - type: string
            - type: null
          description: Error message if unavailable.
        source:
          type: string
          enum:
            - hardware
            - derived
            - unavailable
          description: Telemetry provenance.
