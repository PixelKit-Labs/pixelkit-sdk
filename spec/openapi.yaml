    usePlayIntegrityTelemetry:
      type: object
      description: |
  Hardware security feature flags and Android Keystore key attestation. No Play Integrity verdict is produced.

  Reads the android.hardware.strongbox_keystore, android.hardware.hardware_keystore (FeatureInfo.version), android.hardware.keystore.app_attest_key and android.hardware.security.model.compatible system features and whether com.google.android.gms is installed. requestAttestation generates an EC key with an attestation challenge (StrongBox when the device declares it, with a fallback to the default keystore), reads KeyInfo.getSecurityLevel() (API 31+), and returns the certificate chain (base64, leaf first), its length, the leaf subject and issuer, and the challenge bytes actually used (generated when none is passed). The chain is returned as produced by the Keystore: this hook does not verify it. Verify it on a server against the challenge and Google's attestation roots. No Play Integrity API call is made and no integrity verdict is produced.
      properties:
