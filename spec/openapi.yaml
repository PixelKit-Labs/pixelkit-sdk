  /hooks/useCPU:
    get:
      summary: What the CPU is and how hard it is working right now.
      description: |
  Tells you the shape of the processor (how many cores, which type, how fast each one can go) and how busy it is at this instant. Use it to decide whether the phone has room for heavy work, or to show a live performance readout.

  Core identity comes from /proc/cpuinfo and per-core frequencies from the cpufreq sysfs tree, both read through the PixelNative module. Two different load signals are reported and they mean different things: cpuLoadPercent is how close the cores are running to their maximum clock, read from hardware; appCpuPercent is this app's own share of CPU time, computed from process time over wall time. Android does not let apps read system-wide /proc/stat, so this hook has no whole-system load figure and does not invent one. For real whole-system CPU utilisation (read from /proc/stat by the PixelKit ADB daemon) use useSystemLoad.
      operationId: get_useCPU
      tags:
        - silicon-compute
      responses:
        200:
