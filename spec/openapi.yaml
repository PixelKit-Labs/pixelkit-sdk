  Sets the brightness sent to the daemon. While the ring is lit the level is sent immediately; while it is off the level is kept for the next lit command.

  **Output Contract**: While lit: true when the daemon accepted it, false and error otherwise. While off: true, because nothing is sent until the next lit command.
      operationId: useHiLight_setBrightness
