  /hooks/useGeminiLive:
    get:
      summary: "Bidirectional streaming of text, microphone audio chunks and camera frames with the Gemini Live API over a WebSocket, with tool calls routed through a capability adapter you supply."
      description: |
  Streams text, audio chunks and camera frames to Gemini in the cloud over a WebSocket and shows the transcript the model sends back. Model tool calls run only against the capabilities adapter you pass to connect.

  Opens a WebSocket to the Gemini Live API (BidiGenerateContent). You supply the session's trace context and capability adapter to connect(); the API key comes from run.apiKey or the stored key. sendAudioChunk, sendImageChunk and sendVideoFrame forward base64 PCM audio and JPEG frames as realtime input, and sendText and sendMultimodalTurn send client turns. The hook does not capture audio or decode and play the model's audio: isSpeaking means audio parts from the model are arriving, and the audio bytes themselves are not played or exposed. isListening and isStreamingMedia are set when a chunk is sent and clear 2 s after the last one. Model tool calls are validated and executed through runTool against the adapter's tools; each call is a network round trip plus the tool's own execution time. The default model is the DEFAULT_LIVE_MODEL constant (currently 'models/gemini-2.0-flash-exp'); config.model overrides it.
      operationId: get_useGeminiLive
      tags:
        - neural-ai
      parameters:
        - name: config
          in: query
          description: "Optional. model (default DEFAULT_LIVE_MODEL), voiceName (one of 'Puck', 'Charon', 'Kore', 'Fenrir', 'Aoede'; default 'Aoede'), systemInstruction, and thinkingBudget (tokens; thinkingConfig is only sent when it is a non-zero number). Capabilities are not part of config: pass them to connect()."
          required: false
          schema:
            $ref: "#/components/schemas/GeminiLiveConfig"
      responses:
        200:
          description: Current telemetry reading from useGeminiLive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useGeminiLiveTelemetry"
  /hooks/useGeminiLive/actions/connect:
