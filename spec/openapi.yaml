    useGeminiLiveTelemetry:
      type: object
      description: |
  Bidirectional streaming of text, microphone audio chunks and camera frames with the Gemini Live API over a WebSocket, with tool calls routed through a capability adapter you supply.

  Opens a WebSocket to the Gemini Live API (BidiGenerateContent). You supply the session's trace context and capability adapter to connect(); the API key comes from run.apiKey or the stored key. sendAudioChunk, sendImageChunk and sendVideoFrame forward base64 PCM audio and JPEG frames as realtime input, and sendText and sendMultimodalTurn send client turns. The hook does not capture audio or decode and play the model's audio: isSpeaking means audio parts from the model are arriving, and the audio bytes themselves are not played or exposed. isListening and isStreamingMedia are set when a chunk is sent and clear 2 s after the last one. Model tool calls are validated and executed through runTool against the adapter's tools; each call is a network round trip plus the tool's own execution time. The default model is the DEFAULT_LIVE_MODEL constant (currently 'models/gemini-2.0-flash-exp'); config.model overrides it.
      properties:
        isConnected:
          type: boolean
          description: Whether the WebSocket session to Gemini Live is active and ready.
        isStreaming:
          type: boolean
          description: Whether the model is actively streaming an audio or text response.
        isSpeaking:
          type: boolean
          description: "Whether audio parts from the model are arriving. The hook does not play audio, so this does not mean sound is coming out of the device."
        isListening:
          type: boolean
          description: True after an audio chunk was sent and clears 2 seconds after the last one (or on disconnect).
        isStreamingMedia:
          type: boolean
          description: True after an image or video frame was sent and clears 2 seconds after the last one (or on disconnect).
        transcript:
          type: array
          items:
            $ref: "#/components/schemas/LiveMessage"
          description: Real-time transcript of conversational dialogue.
        currentThinking:
          anyOf:
            - type: string
            - type: null
          description: Latest reasoning thoughts emitted by the model during extended thinking.
        activeToolCalls:
          type: array
          items:
            $ref: "#/components/schemas/LiveToolCall"
          description: Real-time hardware tool invocations executed during the session.
        error:
          anyOf:
            - type: string
            - type: null
          description: Error message if connection or streaming protocol encountered a failure.
        source:
          $ref: "#/components/schemas/TelemetrySource"
          description: "'hardware' while the WebSocket session is connected, 'unavailable' otherwise. It records that the cloud session is open, not that device hardware is involved."
        context:
          anyOf:
            - $ref: "#/components/schemas/TraceContext"
            - type: null
          description: "Trace context of the current session, or null before connect() has been called."
      required:
        - source
    useGeminiLive_connect_Request:
      type: object
      description: Request payload for connect on useGeminiLive.
      properties:
        run:
          $ref: "#/components/schemas/GeminiLiveRunOptions"
          description: "{ context: TraceContext; capabilityAdapter: CapabilityAdapter; apiKey?: string; sink?: ObservabilitySink; redaction?: RedactionPolicy }. The adapter defines which tools the model may call; tools it does not list are not offered."
