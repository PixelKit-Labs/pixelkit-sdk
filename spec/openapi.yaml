    useHiLightTelemetry:
      type: object
      description: |
  The eight-LED ring around the rear camera flash. Real LEDs or nothing.

  Android 17 exposes the array as eight lights of type Light.LIGHT_TYPE_APPLICATION, but every lights session needs CONTROL_DEVICE_LIGHTS, which is signature|privileged and cannot be held by a normal app. PixelKit therefore ships a small Java daemon that runs as the adb shell user and listens on 127.0.0.1:11080; start it with npm run hilight:daemon. With the daemon up, availability is hardware and the calls drive real LEDs. Without it, availability is unavailable and every control function refuses: it resolves false and sets error. Nothing is mirrored on screen. mode, isActive and currentColor change only after the daemon answered a command with a 2xx status.
      properties:
        availability:
          type: string
          enum:
            - hardware
            - unavailable
            - unsupported
          description: "Whether calls reach the LEDs ('hardware'), the daemon is not running ('unavailable'), or this device has no array."
        isHardwareSupported:
          type: boolean
          description: Whether this device physically has the LED array.
        isDaemonConnected:
          type: boolean
          description: "Whether the local daemon answered its last status check, polled every five seconds."
        isActive:
          type: boolean
          description: Whether the ring is currently lit.
        currentColor:
          type: string
          description: Active colour as a hex string.
        mode:
          $ref: "#/components/schemas/HiLightMode"
          description: "Pattern label: off, glow, breathing, pulse, gemini_thinking, incoming_call or notification."
        brightness:
          type: number
          description: "0 to 1, sent to the daemon with the next lit command. The initial 0.85 is the hook's default request, not a value read from the LEDs."
        source:
          type: string
          enum:
            - hardware
            - derived
            - unavailable
          description: "Where the numbers came from. There is no 'simulated' value: a reading is real, derived from real readings, or unavailable."
        error:
          anyOf:
            - type: string
            - type: null
          description: "Latest failure message from a refused or failed control call, or `null` after the next accepted command."
      required:
        - source
