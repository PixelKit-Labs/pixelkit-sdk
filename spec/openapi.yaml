        isMetered:
          type: boolean
          description: Whether the user pays for this traffic. Gate large transfers on it.
        isAirplaneMode:
          type: boolean
          description: Whether airplane mode is on.
        hasRead:
          type: boolean
          description: "Whether a read has completed. Before it, the values above are defaults."
        isChecking:
