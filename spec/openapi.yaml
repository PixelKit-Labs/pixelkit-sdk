  Switches the animation pattern, optionally with a colour sent in the same daemon command. Refuses when the daemon is not connected.

  **Output Contract**: Resolves true when the daemon accepted the command; mode, isActive and (when lit) currentColor update only then. Resolves false and sets error otherwise.
      operationId: useHiLight_setMode
