          description: Whether the hardware accepted the command.
        output:
          description: "Resolves the absolute path when the file exists with a non-zero size (size in lastTraceSizeBytes); null with error set when there was no trace, the platform delivered no file, or the file is missing or empty."
        error:
          anyOf:
            - type: string
            - type: null
          description: Error message if failed.
