  /hooks/useSystemLoad:
    get:
      summary: "Whole-system CPU, GPU and TPU load, from kernel counters an app cannot read itself."
      description: |
  Tells you how busy the whole phone's processor and graphics chip are right now, not just your own app, and which other apps are keeping the GPU busy. It needs a small helper program running on the phone (started over USB or wireless debugging). Without the helper every value is empty and the hook tells you why; it never guesses.

  Android denies apps /proc/stat, /proc/pressure and the GPU and Edge TPU trace events, so whole-system load cannot be measured from inside an app. The PixelKit system-metrics daemon runs as the adb shell user (uid 2000), reads those kernel counters over a rolling one to two second window and serves them as JSON on 127.0.0.1:11081. The hook polls /metrics every two seconds with an 800 ms timeout and validates the response with parseSystemMetrics, which throws naming the offending field when the shape is wrong. CPU utilisation is the non-idle share of /proc/stat jiffies over the window, with iowait counted as idle, overall and per core. GPU utilisation is the summed total_active_duration_ns of the power/gpu_work_period tracepoint over every uid divided by the window, so it is derived from raw trace events; the GPU clock comes from power/gpu_frequency and memory from dumpsys gpu, with the busiest uids listed. TPU utilisation is reported only when the daemon decodes real edgetpu command_start and command_end events; the shell user cannot enable those trace events directly, so on a device where none are observed tpuSource is 'unavailable' and tpuError says why. A section the daemon cannot read, a daemon that is not running, and a sample older than ten seconds all give null values with a stated reason, never a default. useGPU and useCPU are unchanged: they keep reporting what an app can measure about itself.
      operationId: get_useSystemLoad
      tags:
        - silicon-compute
      responses:
        200:
          description: Current telemetry reading from useSystemLoad.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useSystemLoadTelemetry"
  /hooks/useTPU:
    get:
      summary: Whether on-device AI host packages are visible and what the hook actually executed.
      description: |
  Checks which system services for on-device models are visible and reports their versions. It does not run inference or prove the TPU is active.

  AICore hosts Gemini Nano and the TPU is reached via AICore or LiteRT. The hook reports package visibility, not model readiness or hardware usage. Unreadable package state is null. Without a benchmark there is no active delegate, so activeDelegate is null rather than claiming NPU use. AICore and Private Compute Services versions come from PackageManager, which needs a <queries> entry. Inference timings stay null here; measured model latency lives in useGeminiNano. benchmarkTPU is a JavaScript matrix multiply explicitly labelled CPU fallback.
      operationId: get_useTPU
      tags:
        - silicon-compute
      responses:
        200:
          description: Current telemetry reading from useTPU.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useTPUTelemetry"
  /hooks/useTPU/actions/benchmarkTPU:
    post:
      summary: Invoke benchmarkTPU (useTPU)
      description: |
  Runs a 256x256 float matrix multiply in JavaScript and reports it explicitly as a CPU fallback. No part of it touches the TPU.

  **Output Contract**: Resolves with { activeDelegate: "CPU Fallback", isHardwareAccelerated: false, lastInferenceLatencyMs, throughputTokensPerSec: null, memoryFootprintMB: null }. Label it as a CPU number wherever you show it.
      operationId: useTPU_benchmarkTPU
      tags:
        - silicon-compute
      responses:
        200:
          description: Result of invoking benchmarkTPU.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useTPU_benchmarkTPU_Response"
  /hooks/useThermometer:
    get:
      summary: Discovery of the non-contact infrared temperature sensor on Google Pixel Pro hardware; temperatures stay null until a verified decoder exists.
      description: |
  Finds out whether this phone lists the far-infrared temperature sensor that Pixel Pro models carry. It does not read a temperature from it yet, so the temperatures are always null and the reason is in error.

  The native module asks Android SensorManager for a sensor whose type string contains object_temperature or mlx90632, or whose name contains Thermometer or MLX90632, and reports its name in sensorName. PixelKit has no verified decoder for that sensor's samples (unit and channel layout), so surfaceTemperatureC, surfaceTemperatureF and ambientTemperatureC are null and error states which sensor was found and why nothing is read. There is no emissivity or measurement-mode setting: nothing downstream of the sensor would apply it. Nothing is estimated or simulated.
      operationId: get_useThermometer
      tags:
        - sensors-actuators
      responses:
        200:
          description: Current telemetry reading from useThermometer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useThermometerTelemetry"
