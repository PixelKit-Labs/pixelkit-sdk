          description: "`{ peerAddress: string, role?: 'initiator' | 'responder' (default 'initiator'), securityLevel?: 1 | 4, sightType?: 'unknown' | 'line_of_sight' | 'non_line_of_sight', locationType?: 'unknown' | 'indoor' | 'outdoor', updateRate?: 'normal' | 'infrequent' | 'frequent' }`. peerAddress is required: six colon-separated hex bytes such as \"AA:BB:CC:DD:EE:FF\". The optional fields are passed to BleCsRangingParams; omitted means the platform default."
