    useNetworkTelemetry:
      type: object
      description: |
  Connection type, address and whether traffic actually goes anywhere.

  Reads from expo-network: interface type, IP address, reachability and airplane mode. Being connected to Wi-Fi is not the same as having internet, which is why isConnected reflects a usable route rather than merely an attached interface. isMetered comes from the native module: true when the active network lacks NET_CAPABILITY_NOT_METERED (ConnectivityManager), so a metered Wi-Fi hotspot is metered and an unmetered cellular plan is not. It is null when there is no active network or the read is not permitted. isAirplaneMode is null when its read failed.
      properties:
        networkType:
          type: string
          description: "WIFI, CELLULAR, NONE or UNKNOWN."
