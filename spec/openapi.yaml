  /hooks/usePerfetto:
    get:
      summary: "Real Android system traces (Perfetto format) of this app, plus os.Trace markers."
      description: |
  Starts and stops a system performance trace and hands back the .perfetto-trace file, viewable in ui.perfetto.dev. Custom trace sections and counters from your code appear inside the trace.

  startTrace asks the platform for a real Perfetto system trace. On Android 15+ it uses android.os.ProfilingManager: the platform records a trace of this app and delivers the file; its data sources are chosen by the platform, so the categories you pass are not applied (activeCategories stays empty and availableCategories is empty). Where ProfilingManager is absent it runs /system/bin/perfetto with the requested atrace categories, which many devices refuse to let an app execute. When no backend can start, startTrace resolves false and error says why; it never reports a trace that is not recording. stopTrace returns the file path only after checking the file exists with a non-zero size, with its size in lastTraceSizeBytes; otherwise it returns null and sets error. perfettoVersion is read from `perfetto --version` when the app can execute the binary, and is null with perfettoVersionReason otherwise. beginSection, endSection and setCounter use android.os.Trace and are recorded only while a trace is running.
      operationId: get_usePerfetto
      tags:
        - silicon-compute
      responses:
        200:
          description: Current telemetry reading from usePerfetto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/usePerfettoTelemetry"
  /hooks/usePerfetto/actions/startTrace:
    post:
      summary: Invoke startTrace (usePerfetto)
      description: |
  Start a system trace with the optional categories and buffer size.

  **Output Contract**: Resolves true when a backend accepted the request and reported no failure; false with the reason in error otherwise. With ProfilingManager the categories are not applied and the platform may refuse (rate limit, trace already in progress).
      operationId: usePerfetto_startTrace
      tags:
        - silicon-compute
      responses:
        200:
          description: Result of invoking startTrace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/usePerfetto_startTrace_Response"
  /hooks/usePerfetto/actions/stopTrace:
    post:
      summary: Invoke stopTrace (usePerfetto)
      description: |
  Stop the active trace and verify the .perfetto-trace file.

  **Output Contract**: Resolves the absolute path when the file exists with a non-zero size (size in lastTraceSizeBytes); null with error set when there was no trace, the platform delivered no file, or the file is missing or empty.
      operationId: usePerfetto_stopTrace
      tags:
        - silicon-compute
      responses:
        200:
          description: Result of invoking stopTrace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/usePerfetto_stopTrace_Response"
