    useDisplayTelemetry:
      type: object
      description: |
  Refresh rate, HDR capability, brightness, high brightness mode, and the screen wake lock.

  Display mode, supported refresh rates, HDR types, and resolution come from the Android Display object through the native module, re-read every two seconds because adaptive refresh rate changes the active mode continuously. Brightness uses expo-brightness and the wake lock uses expo-keep-awake. setPreferredRefreshRate requests a rate, setHighBrightnessMode requests maximum window brightness (BRIGHTNESS_OVERRIDE_FULL) plus an HDR headroom of 3.0 on API 34+, and setPreferredDisplayMode requests a panel mode by ID. These are window-attribute requests; the panel's own High Brightness Mode is controlled by firmware and is not read.
      properties:
        refreshRateHz:
          type: number
          description: Rate the panel is running at right now. Changes on its own with adaptive refresh.
        hasArrSupport:
          anyOf:
            - type: boolean
            - type: null
          description: Whether adaptive refresh rate is supported.
        supportedRefreshRates:
          type: array
          items:
            type: number
          description: "Every rate the panel can drive, down to 1 Hz on this device."
        resolution:
          anyOf:
            - type: object
              description: "{ width, height, densityDpi }"
            - type: null
          description: Physical resolution and density of the active mode.
        hdrTypes:
          type: array
          items:
            type: number
          description: "Supported HDR formats: 1 Dolby Vision, 2 HDR10, 3 HLG, 4 HDR10+."
        isHdr:
          type: boolean
          description: Whether the panel reports HDR capability at all.
        maxLuminance:
          anyOf:
            - type: number
            - type: null
          description: "Peak luminance the panel reports, when it reports one."
        hdrSdrRatio:
          anyOf:
            - type: number
            - type: null
          description: "Current HDR to SDR luminance boost ratio (Android 14+ / API 34+), or null if not reported."
        isHbmActive:
          type: boolean
          description: "Whether the last setHighBrightnessMode(true) request was accepted and not since reversed. A record of the request, not a read of the panel's firmware-controlled High Brightness Mode."
        brightness:
          type: number
          description: Current screen brightness from 0 to 1.
        isKeepAwake:
          type: boolean
          description: Whether this app is currently holding the screen on.
        error:
          anyOf:
            - type: string
            - type: null
          description: "Latest failure message, or null."
        source:
          type: string
          enum:
            - hardware
            - derived
            - unavailable
          description: "Where the numbers came from. There is no 'simulated' value: a reading is real, derived from real readings, or unavailable."
      required:
        - source
