  Sets a solid colour and turns the ring on, switching the mode from off to glow when needed. Refuses when the daemon is not connected.

  **Output Contract**: Resolves true when the daemon accepted the command; currentColor, mode and isActive update only then. Resolves false and sets error otherwise.
      operationId: useHiLight_setColor
