  /hooks/useCapabilities:
    get:
      summary: What this particular phone actually has.
      description: |
  The first hook to call. It answers "does this device have that?" so your interface can hide features the phone does not support, instead of showing a control that will fail.

  Resolution starts from a model table keyed on the device name (inference, not a device read), then upgrades the PackageManager-probed flags (UWB, NFC, BLE Channel Sounding, Wi-Fi RTT, satellite, StrongBox, NPU) and the AICore version when the native module is present, at which point verification changes from model-table to device. Only those probed fields come from the device. hasHiLight, hasTitanM3, geminiNanoTier, isPixel, pixelGeneration, isProModel, isFoldable and the supports* flags are always derived from the model name or the API level, even after device verification; the provenance map reports that per field. Fields that can only be answered by the device are null until verification happens.
      operationId: get_useCapabilities
      tags:
        - system-media
      responses:
        200:
          description: Current telemetry reading from useCapabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useCapabilitiesTelemetry"
  /hooks/useCellular:
    get:
      summary: "Carrier, radio generation and network codes from the modem."
      description: |
  Tells you whether the phone is on 5G or something slower, and which carrier is serving it. useNetwork can only say the connection is cellular; this says what kind, which is what you need before deciding to stream or download something large.

  Wraps expo-cellular. generation reflects the current data connection, so it changes as the phone moves and reads unknown when there is no cellular data attached, including on Wi-Fi. Carrier name and the mobile country and network codes need the phone-state permission on Android; without it they stay null rather than being guessed. The country and network codes together identify a carrier globally, which is more reliable than matching on the display name.
      operationId: get_useCellular
      tags:
        - system-media
      responses:
        200:
          description: Current telemetry reading from useCellular.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useCellularTelemetry"
  /hooks/useCellular/actions/refresh:
    post:
      summary: Invoke refresh (useCellular)
      description: |
  Re-reads everything the platform answers without prompting.

  **Output Contract**: Resolves once generation, carrier and network codes have been updated. Values that need the phone-state permission stay null without it.
      operationId: useCellular_refresh
      tags:
        - system-media
      responses:
        200:
          description: Result of invoking refresh.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useCellular_refresh_Response"
  /hooks/useCellular/actions/requestPermission:
    post:
      summary: Invoke requestPermission (useCellular)
      description: |
  Asks for the phone-state permission, which unlocks carrier name and network codes on Android.

  **Output Contract**: Resolves true when granted, and refreshes automatically. Generation is readable without it.
      operationId: useCellular_requestPermission
      tags:
        - system-media
      responses:
        200:
          description: Result of invoking requestPermission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useCellular_requestPermission_Response"
  /hooks/useChannelSounding:
    get:
      summary: Bluetooth LE Channel Sounding availability and real ranging sessions against a Bluetooth peer.
      description: |
  Reports whether this phone declares Bluetooth Channel Sounding, and measures the distance to a second Bluetooth device whose address you supply. Nothing is measured without a peer.

  Support, adapter state and ranging service readiness come from the android.hardware.bluetooth_le.channel_sounding feature flag, a lookup of the ranging HAL service (IBluetoothChannelSounding) and the Bluetooth adapter, carrying source hardware. rangingAvailability and supportedSecurityLevels are what android.ranging.RangingManager reports for BLE Channel Sounding (BleCsRangingCapabilities); they are null when the platform did not deliver them. startRanging(config) opens a real android.ranging.RangingSession (Android 16, API 36+, RAW session with BleCsRangingParams) with the peer at config.peerAddress. The call resolves true only when the platform reports the session open; otherwise it resolves false and sessionError carries a status such as needs_peer_address, channel_sounding_unsupported, channel_sounding_disabled, ranging_api_unavailable, bluetooth_disabled, permission_denied (android.permission.RANGING must be declared and granted), session_active, invalid_parameters or open_failed. Every measurement is an android.ranging.RangingData sample: a distance in metres, a confidence ('low', 'medium', 'high'), an RSSI when the platform supplied one, and a timestamp, each null when omitted. RangingData does not say whether phase-based ranging or round-trip time produced a sample, so the hook reports no method, channel count or accuracy figure. Nothing is simulated: with no peer answering, measurements stays empty.
      operationId: get_useChannelSounding
      tags:
        - radios-security
      responses:
        200:
          description: Current telemetry reading from useChannelSounding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useChannelSoundingTelemetry"
  /hooks/useChannelSounding/actions/startRanging:
    post:
      summary: Invoke startRanging (useChannelSounding)
      description: |
  Opens a real BLE Channel Sounding ranging session with the peer at config.peerAddress.

  **Output Contract**: Resolves true when the platform reported the session open; false with the status and reason in sessionError when the peer address is missing or malformed, the device or OS cannot range, Bluetooth is off, a permission is missing, another session is running, or the platform refused to open. sessionInfo is updated either way.
      operationId: useChannelSounding_startRanging
      tags:
        - radios-security
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/useChannelSounding_startRanging_Request"
      responses:
        200:
          description: Result of invoking startRanging.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useChannelSounding_startRanging_Response"
  /hooks/useChannelSounding/actions/stopRanging:
    post:
      summary: Invoke stopRanging (useChannelSounding)
      description: |
  Closes the running Channel Sounding ranging session.

  **Output Contract**: Returns `{ wasActive, closed, sessionId, error, timestampMs }`: wasActive is false when nothing was running, and error carries a failure from the platform's stop or close. Returns null when the native module is absent.
      operationId: useChannelSounding_stopRanging
      tags:
        - radios-security
      responses:
        200:
          description: Result of invoking stopRanging.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useChannelSounding_stopRanging_Response"
  /hooks/useChannelSounding/actions/refresh:
    post:
      summary: Invoke refresh (useChannelSounding)
      description: |
  Re-probes the feature flag, HAL service and adapter state.

  **Output Contract**: Returns `{ isSupported, isEnabled, serviceFound, hasChannelSoundingFeature, error }`, or null when the native module is absent.
      operationId: useChannelSounding_refresh
      tags:
        - radios-security
      responses:
        200:
          description: Result of invoking refresh.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useChannelSounding_refresh_Response"
  /hooks/useChargingIntelligence:
    get:
      summary: "Deep battery health, cycle count, manufacturing dates, and charging wattage tiers."
      description: |
  Surfaces low-level battery health indicators: lifetime physical charge cycles, maximum state of health (SoH) capacity relative to design, manufacture and first-activation dates, and USB-PD PPS fast charging tiers.

  Reads Android 14+ battery health metrics and Google Pixel power supply sysfs telemetry. Provides lifetime charge cycles (BatteryManager.EXTRA_CYCLE_COUNT), state of health percentage (/sys/class/power_supply/battery/soh), manufacture date, first-use date, charging wattage (BATTERY_PROPERTY_CURRENT_NOW times the battery voltage, only while the current is positive), and a tier classified from that wattage (slow, standard, rapid, ultra_rapid at 30 W and above). Values the app cannot read are null.
      operationId: get_useChargingIntelligence
      tags:
        - silicon-compute
      responses:
        200:
          description: Current telemetry reading from useChargingIntelligence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useChargingIntelligenceTelemetry"
  /hooks/useChargingIntelligence/actions/refresh:
    post:
      summary: Invoke refresh (useChargingIntelligence)
      description: Requests an updated battery intelligence reading.
      operationId: useChargingIntelligence_refresh
      tags:
        - silicon-compute
      responses:
        200:
          description: Result of invoking refresh.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useChargingIntelligence_refresh_Response"
  /hooks/useCloudHardwareAgent:
    get:
      summary: Multi-turn Gemini tool-calling loop over the capability adapter you pass to each ask().
      description: |
  Runs a loop with Gemini in the cloud: the model can call the tools in the capability adapter you pass, the hook runs them on the device and sends the results back, until the model answers or the step limit is reached.

  Wraps runCloudAgent from @google/genai: ask() sends the prompt and the conversation so far, executes each model tool call through runTool against run.capabilityAdapter, folds the results back into the next turn, and stops when the model answers, maxSteps (default DEFAULT_MAX_STEPS, 6) is reached, the run is cancelled, or no capability or API key is available. The default model is the DEFAULT_AGENT_MODEL constant. Intermediate tool steps are reported in steps and final text in lastResponse. The hook does not request or surface model thoughts.
      operationId: get_useCloudHardwareAgent
      tags:
        - neural-ai
      parameters:
        - name: defaultOptions
          in: query
          description: "Optional defaults merged under each ask() run: model, systemInstruction, temperature, maxSteps and onStep. Per-ask values win. The adapter and trace context are not defaults; they are passed to ask()."
          required: false
          schema:
            $ref: "#/components/schemas/CloudAgentDefaultsPartialOmitCloudAgentOptionscapabilityAdaptercontextsinkredactionsignal"
      responses:
        200:
          description: Current telemetry reading from useCloudHardwareAgent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useCloudHardwareAgentTelemetry"
  /hooks/useCloudHardwareAgent/actions/ask:
    post:
      summary: Invoke ask (useCloudHardwareAgent)
      description: |
  Runs the multi-turn tool-calling loop for one prompt against run.capabilityAdapter.

  **Output Contract**: Resolves with { text, contents, steps, totalSteps, stoppedReason: 'completed' | 'max_steps_exceeded' | 'unavailable' | 'cancelled', context, unavailableReason?, providerRequestId?, usage? }, or null for a blank prompt or when the loop threw (reason in error). A missing API key or empty adapter resolves with stoppedReason 'unavailable'.
      operationId: useCloudHardwareAgent_ask
      tags:
        - neural-ai
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/useCloudHardwareAgent_ask_Request"
      responses:
        200:
          description: Result of invoking ask.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useCloudHardwareAgent_ask_Response"
  /hooks/useCloudHardwareAgent/actions/reset:
    post:
      summary: Invoke reset (useCloudHardwareAgent)
      description: "Clears agent memory, step history, and conversation turns."
      operationId: useCloudHardwareAgent_reset
      tags:
        - neural-ai
      responses:
        200:
          description: Result of invoking reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useCloudHardwareAgent_reset_Response"
  /hooks/useDevice:
    get:
      summary: "Device identity, battery level, thermistor temperature, voltage, current, and wattage."
      description: |
  Facts about the phone, its hardware identity, and its real physical power state: battery level, fuel gauge thermistor temperature, instantaneous cell voltage and current flow, wattage draw/charging rate, health status, and lifetime charge cycles.

  Identity comes from expo-device, external-power state from native battery EXTRA_PLUGGED and expo-battery listeners, and deep physical battery telemetry from PixelNative.getBatteryTelemetry(). isCharging reports whether AC, USB, wireless, or dock power is attached, including Android NOT_CHARGING while a full battery or charge limit pauses current flow; null means unreadable. Inspect batteryTelemetry.status to distinguish CHARGING, FULL, and NOT_CHARGING. batteryTemperatureC reads the actual lithium pack NTC thermistor in 0.1 °C units. batteryVoltageMv and batteryCurrentMa give cell voltage and live current; batteryPowerWatts computes wattage (V × |I|). On Android 14+, batteryCycleCount reads lifetime charge cycles. Unavailable readings are null.
      operationId: get_useDevice
