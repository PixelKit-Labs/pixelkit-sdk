    useCloudHardwareAgentTelemetry:
      type: object
      description: |
  Multi-turn Gemini tool-calling loop over the capability adapter you pass to each ask().

  Wraps runCloudAgent from @google/genai: ask() sends the prompt and the conversation so far, executes each model tool call through runTool against run.capabilityAdapter, folds the results back into the next turn, and stops when the model answers, maxSteps (default DEFAULT_MAX_STEPS, 6) is reached, the run is cancelled, or no capability or API key is available. The default model is the DEFAULT_AGENT_MODEL constant. Intermediate tool steps are reported in steps and final text in lastResponse. The hook does not request or surface model thoughts.
      properties:
        isRunning:
          type: boolean
          description: Whether the autonomous reasoning loop is actively executing multi-turn tool steps.
        steps:
          type: array
          items:
            $ref: "#/components/schemas/AgentStepInfo"
          description: Ordered list of tool execution steps taken by the model during the latest execution.
        lastResponse:
          anyOf:
            - type: string
            - type: null
          description: Latest response text returned by the cloud agent.
        lastResult:
          anyOf:
            - $ref: "#/components/schemas/CloudAgentResult"
            - type: null
          description: Complete result payload of the last agent execution including stop reason.
        history:
          type: array
          items:
            $ref: "#/components/schemas/Content"
          description: Full conversation turn history with model tool calls and function outputs.
        error:
          anyOf:
            - type: string
            - type: null
          description: "Error message if agent initialization, network, or execution failed."
        source:
          $ref: "#/components/schemas/TelemetrySource"
          description: "'hardware' when an API key is present, otherwise 'unavailable'. It records that a cloud call is possible, not that device hardware was read; the tools run against the adapter you pass."
      required:
        - source
    useCloudHardwareAgent_ask_Request:
      type: object
      description: Request payload for ask on useCloudHardwareAgent.
      properties:
        prompt:
          type: string
          description: The user request. A blank prompt resolves null.
        run:
          $ref: "#/components/schemas/CloudAgentOptions"
          description: "{ capabilityAdapter: CapabilityAdapter; context: TraceContext; model?; systemInstruction?; maxSteps?; temperature?; signal?: AbortSignal; onStep?; sink?; redaction? }."
      required:
        - prompt
        - run
    useCloudHardwareAgent_ask_Response:
      type: object
      description: Response payload for ask on useCloudHardwareAgent.
      properties:
        success:
          type: boolean
          description: Whether the hardware accepted the command.
        output:
          description: "Resolves with { text, contents, steps, totalSteps, stoppedReason: 'completed' | 'max_steps_exceeded' | 'unavailable' | 'cancelled', context, unavailableReason?, providerRequestId?, usage? }, or null for a blank prompt or when the loop threw (reason in error). A missing API key or empty adapter resolves with stoppedReason 'unavailable'."
        error:
          anyOf:
            - type: string
            - type: null
          description: Error message if failed.
        source:
          $ref: "#/components/schemas/TelemetrySource"
      required:
        - success
        - source
    useCloudHardwareAgent_reset_Request:
      type: object
      description: Request payload for reset on useCloudHardwareAgent.
      properties:{}
    useCloudHardwareAgent_reset_Response:
      type: object
      description: Response payload for reset on useCloudHardwareAgent.
      properties:
        success:
          type: boolean
          description: Whether the hardware accepted the command.
        output:
          description: Result description
        error:
          anyOf:
            - type: string
            - type: null
          description: Error message if failed.
        source:
          $ref: "#/components/schemas/TelemetrySource"
      required:
        - success
        - source
    useDeviceTelemetry:
      type: object
      description: |
  Device identity, battery level, thermistor temperature, voltage, current, and wattage.

  Identity comes from expo-device, external-power state from native battery EXTRA_PLUGGED and expo-battery listeners, and deep physical battery telemetry from PixelNative.getBatteryTelemetry(). isCharging reports whether AC, USB, wireless, or dock power is attached, including Android NOT_CHARGING while a full battery or charge limit pauses current flow; null means unreadable. Inspect batteryTelemetry.status to distinguish CHARGING, FULL, and NOT_CHARGING. batteryTemperatureC reads the actual lithium pack NTC thermistor in 0.1 °C units. batteryVoltageMv and batteryCurrentMa give cell voltage and live current; batteryPowerWatts computes wattage (V × |I|). On Android 14+, batteryCycleCount reads lifetime charge cycles. Unavailable readings are null.
      properties:
        modelName:
          anyOf:
            - type: string
            - type: null
          description: "Commercial model name (e.g. \"Pixel 11 Pro\"); null when the platform does not report it."
        brand:
          anyOf:
            - type: string
            - type: null
          description: "Hardware manufacturer brand (e.g. \"Google\"); null when the platform does not report it."
        osVersion:
          anyOf:
            - type: string
            - type: null
          description: Android release string; null when the platform does not report it.
        batteryPercent:
          anyOf:
            - type: number
            - type: null
          description: "Honest charge percentage, null until the platform answers."
        isCharging:
          anyOf:
            - type: boolean
            - type: null
          description: "External charger attached (AC, USB, wireless or dock), even when Android pauses charging at 100% or a charge limit. Null until observed; batteryTelemetry.status distinguishes active charging from paused/full."
        lowPowerMode:
          anyOf:
            - type: boolean
            - type: null
          description: Whether Battery Saver is active; null until the first read or when the read failed. Treat true as a direct instruction to do less work.
        networkType:
          type: string
          description: "Active network connection type (e.g. \"WIFI\", \"CELLULAR\")."
        isConnected:
          type: boolean
          description: "Whether a working, reachable internet route exists."
        totalMemoryMB:
          type: number
          description: "Total system LPDDR5X RAM in MB, when the platform reports it."
        batteryTemperatureC:
          anyOf:
            - type: number
            - type: null
          description: Real physical battery temperature in °C from the fuel gauge NTC thermistor.
        batteryVoltageMv:
          anyOf:
            - type: number
            - type: null
          description: Instantaneous battery cell terminal voltage in millivolts (e.g. 4120 mV).
        batteryCurrentMa:
          anyOf:
            - type: number
            - type: null
          description: "Instantaneous current flow in mA (negative discharging, positive charging)."
        batteryCurrentAvgMa:
          anyOf:
            - type: number
            - type: null
          description: Rolling average current flow in mA from the fuel gauge.
        batteryPowerWatts:
          anyOf:
            - type: number
            - type: null
          description: "Real-time power consumption or fast-charging rate in Watts (V × |I|)."
        batteryHealth:
          anyOf:
            - type: string
              enum:
                - GOOD
                - OVERHEAT
                - DEAD
                - OVER_VOLTAGE
                - UNSPECIFIED_FAILURE
                - COLD
                - UNKNOWN
            - type: null
          description: Hardware battery health state reported by the PMIC.
        batteryCycleCount:
          anyOf:
            - type: number
            - type: null
          description: Lifetime charge cycle count stored in the battery EEPROM (Android 14+).
        batteryChargeCounterMah:
          anyOf:
            - type: number
            - type: null
          description: Remaining battery charge capacity in milliampere-hours (mAh).
        batteryEnergyCounterMwh:
          anyOf:
            - type: number
            - type: null
          description: Remaining stored energy in milliwatt-hours (mWh).
        batteryTechnology:
          anyOf:
            - type: string
            - type: null
          description: "Battery cell chemistry string (e.g. \"Li-ion\")."
        pluggedSource:
          anyOf:
            - type: string
              enum:
                - AC
                - USB
                - WIRELESS
                - DOCK
                - NONE
            - type: null
          description: "Observed AC, USB, wireless, dock or NONE power source; null if the battery broadcast was unreadable."
        batteryTelemetry:
          anyOf:
            - $ref: "#/components/schemas/BatteryTelemetry"
            - type: null
          description: Full native battery telemetry structure including probed thermal zones.
        hasRead:
          type: boolean
          description: "Whether any power, battery, or network value has been successfully read."
        error:
          anyOf:
            - type: string
            - type: null
          description: "Error message if the last telemetry read failed, null otherwise."
        source:
          type: string
          enum:
            - hardware
            - derived
            - unavailable
          description: "Where the numbers came from. There is no 'simulated' value: a reading is real, derived from real readings, or unavailable."
      required:
        - source
    useDevice_refresh_Request:
      type: object
      description: Request payload for refresh on useDevice.
      properties:{}
    useDevice_refresh_Response:
      type: object
      description: Response payload for refresh on useDevice.
      properties:
        success:
          type: boolean
          description: Whether the hardware accepted the command.
        output:
          description: "Promise<void> — Resolves once all battery, electrical, and network states are refreshed."
