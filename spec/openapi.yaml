  /hooks/useWifi7MLO:
    get:
      summary: "Wi-Fi 7 (802.11be) Multi-Link Operation links: band, channel, RSSI, link speeds and state."
      description: |
  Lists the Wi-Fi 7 multi-link operation links of the connected access point with band, channel, signal and link speeds, and whether this phone is associated to more than one of them. Values the platform reports as unknown are null.

  Reads WifiInfo.getAffiliatedMloLinks() (all links of the access point multi-link device) and getAssociatedMloLinks() (the links this station is associated to), Android 14+ (API 34+). Each link carries band (MloLink.getBand(): 2.4GHz, 5GHz, 6GHz, 60GHz or null), channel, rssi, txLinkSpeedMbps and rxLinkSpeedMbps (null when the platform reports an unknown value) and state (MloLink.getState(): unassociated, idle, active, or invalid). The platform exposes no per-link channel width. isMloActive is true when the station is associated to more than one link. aggregateSpeedMbps is the sum of txLinkSpeedMbps (transmit direction only) over the associated links, not a PHY capacity figure; it is null when not multi-link or when no link reported a speed. Reports inactive with an empty links array when the connected access point is not a multi-link device.
      operationId: get_useWifi7MLO
      tags:
        - radios-security
      responses:
        200:
          description: Current telemetry reading from useWifi7MLO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useWifi7MLOTelemetry"
  /hooks/useWifi7MLO/actions/refresh:
    post:
      summary: Invoke refresh (useWifi7MLO)
      description: Requests an updated reading of affiliated Wi-Fi 7 links.
      operationId: useWifi7MLO_refresh
      tags:
        - radios-security
      responses:
        200:
          description: Result of invoking refresh.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useWifi7MLO_refresh_Response"
  /hooks/useWifiRTT:
    get:
      summary: Fine Timing Measurement (FTM / 802.11mc) distance to Wi-Fi access points.
      description: |
  Measures round-trip time (RTT) distance between the phone and nearby Wi-Fi access points that support it, to place the phone indoors within about 1 to 2 meters without GPS.

  startRanging(bssids) runs one real android.net.wifi.rtt.WifiRttManager.startRanging round and waits for the platform's callback. Each BSSID must match an 802.11mc responder in the latest Wi-Fi scan results (WifiManager.getScanResults); BSSIDs that cannot be ranged are never invented into results and are listed in unresolvedBssids with a reason (invalid_bssid, not_in_scan_results, not_80211mc_responder, exceeds_max_peers_N, permission_denied, rtt_unavailable, ranging_timeout, ranging_failed, no_result_returned). Each entry of rangingResults is one access point's RangingResult: status 0 is a measurement, and only then are distanceMm, distanceStdDevMm, rssi and the measurement counters set (they are null for status 1 fail and 2 responder without 802.11mc). When the whole request fails, rangingResults is empty and error carries the onRangingFailure code. Needs ACCESS_FINE_LOCATION, plus NEARBY_WIFI_DEVICES on Android 13+, declared and granted by the app; without them error starts with permission_denied.
      operationId: get_useWifiRTT
      tags:
        - radios-security
      responses:
        200:
          description: Current telemetry reading from useWifiRTT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useWifiRTTTelemetry"
  /hooks/useWifiRTT/actions/startRanging:
    post:
      summary: Invoke startRanging (useWifiRTT)
      description: |
  Performs one round-trip time ranging round to the target BSSIDs.

  **Output Contract**: Resolves the per-AP results. BSSIDs that were not ranged are in unresolvedBssids with the reason; an empty array with error set means the whole request failed.
      operationId: useWifiRTT_startRanging
      tags:
        - radios-security
      responses:
        200:
          description: Result of invoking startRanging.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useWifiRTT_startRanging_Response"
  /hooks/useWifiRTT/actions/refresh:
    post:
      summary: Invoke refresh (useWifiRTT)
      description: Refreshes Wi-Fi RTT service status.
      operationId: useWifiRTT_refresh
      tags:
        - radios-security
      responses:
        200:
          description: Result of invoking refresh.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useWifiRTT_refresh_Response"
components:
  schemas:
    TelemetrySource:
      type: string
      enum:
        - hardware
        - derived
        - unavailable
      description: "Data provenance indicator. PixelKit strictly adheres to the Zero-Simulation Principle: values are real hardware measurements ('hardware'), computed directly from hardware ('derived'), or unavailable ('unavailable'). Unreadable values return null."
    HookCatalogItem:
      type: object
      properties:
        id:
          type: string
          example: useThermometer
        name:
          type: string
          example: useThermometer
        category:
          type: string
          example: sensors-actuators
        chipBadge:
          type: string
          example: FIR · MLX90632 · thermal
        summary:
          type: string
        description:
          type: string
      required:
        - id
        - name
        - category
        - summary
    Vector3D:
      type: object
      description: 3-dimensional Cartesian vector for spatial orientation.
      properties:
        x:
          type: number
          description: Lateral tilt or movement
        y:
          type: number
          description: Longitudinal tilt or movement
        z:
          type: number
          description: Vertical gravitational force or spin
      required:
        - x
        - y
        - z
    BarometerData:
      type: object
      description: Atmospheric pressure and barometric altitude.
      properties:
        pressure:
          anyOf:
            - type: number
            - type: null
          description: Pressure in hPa
        relativeAltitude:
          anyOf:
            - type: number
            - type: null
          description: Altitude in meters
    MloLinkInfo:
      type: object
      description: Wi-Fi 7 Multi-Link Operation (MLO) link of the access point multi-link device. Unknown values are null.
      properties:
        band:
          anyOf:
            - type: string
              enum:
                - 2.4GHz
                - 5GHz
                - 6GHz
                - 60GHz
            - type: null
        channel:
          type: number
        rssi:
          anyOf:
            - type: number
            - type: null
        txLinkSpeedMbps:
          anyOf:
            - type: number
            - type: null
        rxLinkSpeedMbps:
          anyOf:
            - type: number
            - type: null
        state:
          type: string
          enum:
            - invalid
            - unassociated
            - idle
            - active
    WifiRttResult:
      type: object
      description: "One access point measured by WifiRttManager.startRanging. Distance, standard deviation, RSSI and counters are null unless status is 0 (success)."
      properties:
        bssid:
          type: string
        distanceMm:
          anyOf:
            - type: number
            - type: null
        distanceStdDevMm:
          anyOf:
            - type: number
            - type: null
        rssi:
          anyOf:
            - type: number
            - type: null
        numAttemptedMeasurements:
          anyOf:
            - type: number
            - type: null
        numSuccessfulMeasurements:
          anyOf:
            - type: number
            - type: null
        timestampMs:
          anyOf:
            - type: number
            - type: null
        status:
          type: number
          description: "RangingResult status: 0 success, 1 fail, 2 responder without 802.11mc."
        statusName:
          type: string
          enum:
            - success
            - fail
            - responder_no_80211mc
            - unknown
    BlePeripheral:
      type: object
      description: Discovered Bluetooth Low Energy peripheral.
      properties:
        id:
          type: string
        name:
          anyOf:
            - type: string
            - type: null
        rssi:
          type: number
        txPower:
          anyOf:
            - type: number
            - type: null
        isConnectable:
          type: boolean
    MicrophoneInfo:
      type: object
      description: Microphone hardware characteristics from acoustic array.
      properties:
        id:
          type: number
        type:
          type: string
        location:
          type: string
        directionality:
          type: string
        address:
          anyOf:
            - type: string
            - type: null
    CapturedPhoto:
      type: object
      description: Captured high-resolution photo.
      properties:
        uri:
          type: string
        width:
          type: number
        height:
          type: number
        base64:
          anyOf:
            - type: string
            - type: null
    SavedMedia:
      type: object
      description: Media item saved in the gallery.
      properties:
        id:
          type: string
        filename:
          type: string
        uri:
          type: string
        mediaType:
          type: string
        width:
          type: number
        height:
          type: number
        duration:
          type: number
    KeyAgreementKeyPairResult:
      type: object
      description: ECDH key pair generated in the Android Keystore; securityLevel is read from KeyInfo (null when unreadable).
      properties:
        alias:
          type: string
        publicKeyBase64:
          anyOf:
            - type: string
            - type: null
        securityLevel:
          anyOf:
            - type: string
              enum:
                - STRONGBOX
                - TRUSTED_ENVIRONMENT
                - SOFTWARE
                - UNKNOWN_SECURE
            - type: null
        securityLevelReason:
          anyOf:
            - type: string
            - type: null
        isStrongBoxSupported:
          type: boolean
        error:
          anyOf:
            - type: string
            - type: null
    SharedSecretResult:
      type: object
      description: Derived ECDH shared secret.
      properties:
        sharedSecretBase64:
          anyOf:
            - type: string
            - type: null
        secretLengthBytes:
          type: number
    SatelliteGuidance:
      type: object
      description: Antenna pointing guidance for non-terrestrial satellite alignment.
      properties:
        azimuthDeg:
          type: number
        elevationDeg:
          type: number
        isAligned:
          type: boolean
    useADPFTelemetry:
      type: object
      description: |
  How much thermal room is left before the phone slows itself down.

  thermalHeadroom comes from PowerManager.getThermalHeadroom and is sampled every ten seconds. A live thermal-status listener reports the coarse state from NONE through SHUTDOWN. Android 16+ SystemHealthManager CPU/GPU headroom estimates available compute capacity (0..1 after scaling its 0..100 result); it is not thermal headroom or utilization. Android can return NaN with insufficient workload or a transient server error, or throw if a device does not implement it. The unavailable-reason fields distinguish those outcomes, pending reads and API absence. Frame figures pair the display mode refresh rate as a target with the Choreographer-measured rate as the actual. Battery-pack temperature is available separately through useDevice; an FIR object thermometer reading cannot be substituted for it.
      properties:
        thermalHeadroom:
          anyOf:
            - type: number
            - type: null
          description: "0 is cool, 1 means throttling is imminent. The single number to gate heavy work on."
        thermalThresholds:
          anyOf:
            - type: object
              additionalProperties: true
            - type: null
          description: Headroom values at which this specific device enters each thermal status.
        thermalStatus:
          type: string
          enum:
            - nominal
            - light
            - moderate
            - severe
            - critical
          description: "Coarse state, updated by a system listener rather than polling."
        thermalStatusCode:
          type: number
          description: Raw PowerManager constant behind that label.
        cpuHeadroom:
          anyOf:
            - type: number
            - type: null
          description: "Android 16+ available CPU capacity fraction (0..1), not thermal headroom or utilization; null when unmeasured."
        gpuHeadroom:
          anyOf:
            - type: number
            - type: null
          description: "Android 16+ available GPU capacity fraction (0..1), not GPU utilization; null when unmeasured."
        cpuHeadroomUnavailableReason:
          anyOf:
            - type: string
              enum:
                - api_unavailable
                - unsupported
                - temporarily_unavailable
                - read_failed
                - not_sampled
            - type: null
          description: "Null with a measured CPU estimate; otherwise distinguishes missing API, unsupported device, temporary NaN (including insufficient workload), failed read or no sample yet."
        gpuHeadroomUnavailableReason:
          anyOf:
            - type: string
              enum:
                - api_unavailable
                - unsupported
                - temporarily_unavailable
                - read_failed
                - not_sampled
            - type: null
          description: Null with a measured GPU estimate; otherwise the same availability categories as CPU.
        targetFps:
          anyOf:
            - type: number
            - type: null
          description: Refresh rate of the current display mode.
        currentFps:
          anyOf:
            - type: number
            - type: null
          description: "Frames actually presented, measured by Choreographer."
        source:
          type: string
          enum:
            - hardware
            - derived
            - unavailable
          description: "Where the numbers came from. There is no 'simulated' value: a reading is real, derived from real readings, or unavailable."
      required:
        - source
    useADPF_reportWorkDuration_Request:
      type: object
      description: Request payload for reportWorkDuration on useADPF.
      properties:
        actualWorkDurationMs:
          type: number
          description: "How long the work you just did actually took, in milliseconds."
        targetDurationMs:
          type: number
          description: "Budget to judge it against. Defaults to 1000 / targetFps, or 8.33 ms before the refresh rate has been read."
      required:
        - actualWorkDurationMs
    useADPF_reportWorkDuration_Response:
      type: object
      description: Response payload for reportWorkDuration on useADPF.
      properties:
        success:
          type: boolean
          description: Whether the hardware accepted the command.
        output:
          description: "'WITHIN_BUDGET' when the work fits the frame, 'BOOST_REQUESTED' when it overran and you should shed work."
        error:
          anyOf:
            - type: string
            - type: null
          description: Error message if failed.
        source:
          $ref: "#/components/schemas/TelemetrySource"
      required:
        - success
        - source
    useADPFHintSessionTelemetry:
      type: object
      description: |
  PerformanceHintManager hint session: report how long work took against a target duration for the session's threads.

  Uses android.os.PerformanceHintManager (Android 12+, API 31+). On mount the native module closes any previous session, then calls createHintSession for the app's main thread (its tid equals the process id), or for the thread ids passed as threadIds, with the initial target duration. isSupported is true only when createHintSession returned a session; otherwise it is false and error says so. reportWorkDuration and updateTargetWorkDuration forward to Session.reportActualWorkDuration and Session.updateTargetWorkDuration and return true when the platform accepted the call. The session covers the main thread by default, so report durations of work done on that thread (or pass the tids of the threads that do the work); durations measured on the JS thread describe a thread that is not in the session. The native module keeps one session per app.
      properties:
        isSupported:
          type: boolean
          description: Whether createHintSession returned a session (Android 12+).
        targetFrameDurationMs:
          type: number
          description: "Current target work duration in milliseconds, as last set by this hook."
        error:
          anyOf:
            - type: string
            - type: null
          description: Error message if hint session creation or reporting failed.
        source:
          $ref: "#/components/schemas/TelemetrySource"
          description: "Data provenance: 'hardware' when a session exists, 'unavailable' otherwise."
      required:
        - source
    useADPFHintSession_reportWorkDuration_Request:
      type: object
      description: Request payload for reportWorkDuration on useADPFHintSession.
      properties:{}
    useADPFHintSession_reportWorkDuration_Response:
      type: object
      description: Response payload for reportWorkDuration on useADPFHintSession.
      properties:
        success:
          type: boolean
          description: Whether the hardware accepted the command.
        output:
          description: Result description
        error:
          anyOf:
            - type: string
            - type: null
          description: Error message if failed.
        source:
          $ref: "#/components/schemas/TelemetrySource"
      required:
        - success
        - source
    useADPFHintSession_updateTargetWorkDuration_Request:
      type: object
      description: Request payload for updateTargetWorkDuration on useADPFHintSession.
      properties:{}
    useADPFHintSession_updateTargetWorkDuration_Response:
      type: object
      description: Response payload for updateTargetWorkDuration on useADPFHintSession.
      properties:
        success:
          type: boolean
          description: Whether the hardware accepted the command.
        output:
          description: Result description
        error:
          anyOf:
            - type: string
            - type: null
          description: Error message if failed.
        source:
          $ref: "#/components/schemas/TelemetrySource"
      required:
        - success
        - source
    useADPFHintSession_closeSession_Request:
      type: object
      description: Request payload for closeSession on useADPFHintSession.
      properties:{}
    useADPFHintSession_closeSession_Response:
      type: object
      description: Response payload for closeSession on useADPFHintSession.
      properties:
        success:
          type: boolean
          description: Whether the hardware accepted the command.
        output:
          description: Result description
        error:
          anyOf:
            - type: string
            - type: null
          description: Error message if failed.
        source:
          $ref: "#/components/schemas/TelemetrySource"
      required:
        - success
        - source
    useAltimeterTelemetry:
      type: object
      description: |
  Precision barometric altimetry, vertical climb/descent velocity, and weather trends.

  Derived from the physical air pressure sensor via expo-sensors. Computes altitude above calibrated sea level using the standard barometric formula: h = 44330 * (1 - (P / P0)^0.1903). Automatically computes vertical velocity (rate of climb/descent in m/s) with exponential smoothing, categorizes atmospheric pressure trends (rising, steady, falling, rapid_fall), and supports local QNH calibration.
      properties:
        altitudeM:
          anyOf:
            - type: number
            - type: null
          description: Current barometric altitude in meters above calibrated sea level. Null until first sample.
        altitudeFt:
          anyOf:
            - type: number
            - type: null
          description: Current barometric altitude in feet above calibrated sea level. Null until first sample.
        verticalVelocityMs:
          anyOf:
            - type: number
            - type: null
          description: "Rate of climb or descent in meters per second (m/s), smoothed over recent samples. Null until moving."
        pressureHpa:
          anyOf:
            - type: number
            - type: null
          description: Raw atmospheric pressure in hectopascals (hPa / mbar).
        seaLevelPressureHpa:
          type: number
          description: Calibrated reference sea-level pressure in hPa. Defaults to standard 1013.25.
        pressureTrend:
          anyOf:
            - type: string
              enum:
                - rising
                - steady
                - falling
                - rapid_fall
            - type: null
          description: "Pressure change extrapolated to hPa/hour over the retained samples (at most the last 60 s) and classified as rapid_fall (below -1.5), falling (below -0.5), rising (above +0.5) or steady. null until at least 5 samples spanning 10 s exist; it is never 'steady' by default."
        isAvailable:
          type: boolean
          description: Whether the hardware barometer is present and streaming.
        error:
          anyOf:
            - type: string
            - type: null
          description: Error message if sensor access or subscription failed.
        source:
          $ref: "#/components/schemas/TelemetrySource"
          description: "Data provenance: 'derived' from hardware barometer, or 'unavailable'."
      required:
        - source
    useAltimeter_calibrateSeaLevel_Request:
      type: object
      description: Request payload for calibrateSeaLevel on useAltimeter.
      properties:{}
    useAltimeter_calibrateSeaLevel_Response:
      type: object
      description: Response payload for calibrateSeaLevel on useAltimeter.
      properties:
        success:
          type: boolean
          description: Whether the hardware accepted the command.
        output:
          description: Result description
        error:
          anyOf:
            - type: string
            - type: null
          description: Error message if failed.
        source:
          $ref: "#/components/schemas/TelemetrySource"
      required:
        - success
        - source
    useAltimeter_resetCalibration_Request:
      type: object
      description: Request payload for resetCalibration on useAltimeter.
      properties:{}
