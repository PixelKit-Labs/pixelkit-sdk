          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useSpatialAudio_refresh_Response"
  /hooks/useSpeech:
    get:
      summary: Speaking text aloud with the voices the phone has installed.
      description: |
  Reads text out loud. This is the output half of voice: useSpeechAI listens, this one talks back. Which voices exist depends on what the user has downloaded in system settings, so check the list rather than assuming a language is available.

  Wraps expo-speech for the system voice and can address an installed Android TTS service by package name without changing the phone default. Explicit-engine calls fail closed unless Android exposes an exact active-package match: PixelKit inventories and rechecks the installed package/version, resolves voice/locale identity, and rejects missing, changed, mismatched or unobservable engines before synthesis. Platform TTS, explicit Android TTS and Gemini Live audio use distinct output identities. External apps own installation and model downloads; their internal execution provider is not inferred. Speech runs require explicit trace context.
