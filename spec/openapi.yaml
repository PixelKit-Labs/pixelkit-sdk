          type: boolean
          description: Whether the model is actively streaming an audio or text response.
        isSpeaking:
          type: boolean
          description: Whether synthesized speech audio is currently playing.
        isListening:
          type: boolean
          description: Whether the client is streaming microphone audio chunks to the server.
        transcript:
