    usePerfettoTelemetry:
      type: object
      description: |
  Real Android system traces (Perfetto format) of this app, plus os.Trace markers.

  startTrace asks the platform for a real Perfetto system trace. On Android 15+ it uses android.os.ProfilingManager: the platform records a trace of this app and delivers the file; its data sources are chosen by the platform, so the categories you pass are not applied (activeCategories stays empty and availableCategories is empty). Where ProfilingManager is absent it runs /system/bin/perfetto with the requested atrace categories, which many devices refuse to let an app execute. When no backend can start, startTrace resolves false and error says why; it never reports a trace that is not recording. stopTrace returns the file path only after checking the file exists with a non-zero size, with its size in lastTraceSizeBytes; otherwise it returns null and sets error. perfettoVersion is read from `perfetto --version` when the app can execute the binary, and is null with perfettoVersionReason otherwise. beginSection, endSection and setCounter use android.os.Trace and are recorded only while a trace is running.
      properties:
        isSupported:
          type: boolean
          description: "Whether a trace backend can be started: ProfilingManager (Android 15+) or an executable perfetto binary."
        isTracing:
          type: boolean
          description: Whether a trace session is currently recording.
        perfettoVersion:
          anyOf:
            - type: string
            - type: null
          description: "Version parsed from `perfetto --version`. Null when the app cannot execute the binary; perfettoVersionReason says why."
        perfettoVersionReason:
          anyOf:
            - type: string
            - type: null
          description: Why perfettoVersion is null (for example the exec was refused for the app process); null when the version was read.
        backend:
          anyOf:
            - type: string
              enum:
                - profiling_manager
                - perfetto_binary
            - type: null
          description: Which backend records traces on this device; null when none is available.
        availableCategories:
          type: array
          items:
            type: string
          description: "atrace categories the perfetto binary accepts. Empty with the ProfilingManager backend, which picks its own data sources."
        activeCategories:
          type: array
          items:
            type: string
          description: Categories the running trace was configured with. Empty when the backend ignores the request.
        lastTraceUri:
          anyOf:
            - type: string
            - type: null
          description: Absolute path of the last saved .perfetto-trace file. Set only when the file exists and is not empty.
        lastTraceSizeBytes:
          anyOf:
            - type: number
            - type: null
          description: Size in bytes of the last saved trace file.
        traceDurationMs:
          anyOf:
            - type: number
            - type: null
          description: "Time between startTrace and stopTrace for the last saved trace, in milliseconds."
        error:
          anyOf:
            - type: string
            - type: null
          description: "Why the last start or stop produced no trace, or why no backend is available."
        source:
          type: string
          enum:
            - hardware
            - derived
            - unavailable
          description: Telemetry provenance.
      required:
        - source
    usePerfetto_startTrace_Request:
      type: object
      description: Request payload for startTrace on usePerfetto.
      properties:{}
    usePerfetto_startTrace_Response:
      type: object
      description: Response payload for startTrace on usePerfetto.
      properties:
        success:
          type: boolean
          description: Whether the hardware accepted the command.
        output:
          description: "Resolves true when a backend accepted the request and reported no failure; false with the reason in error otherwise. With ProfilingManager the categories are not applied and the platform may refuse (rate limit, trace already in progress)."
        error:
          anyOf:
