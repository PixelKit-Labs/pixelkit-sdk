    useChargingIntelligenceTelemetry:
      type: object
      description: |
  Deep battery health, cycle count, manufacturing dates, and charging wattage tiers.

  Reads Android 14+ battery health metrics and Google Pixel power supply sysfs telemetry. Provides lifetime charge cycles (BatteryManager.EXTRA_CYCLE_COUNT), state of health percentage (/sys/class/power_supply/battery/soh), manufacture date, first-use date, charging wattage (BATTERY_PROPERTY_CURRENT_NOW times the battery voltage, only while the current is positive), and a tier classified from that wattage (slow, standard, rapid, ultra_rapid at 30 W and above). Values the app cannot read are null.
      properties:
        stateOfHealthPercent:
          anyOf:
            - type: number
            - type: null
          description: "Current maximum battery capacity relative to factory design capacity (0-100%), or null if unreadable."
        cycleCount:
          anyOf:
            - type: number
            - type: null
          description: Lifetime physical charge cycles completed by the battery pack.
        manufactureDate:
          anyOf:
            - type: string
            - type: null
          description: Factory manufacture timestamp/date of the physical battery cell.
        firstUsageDate:
          anyOf:
            - type: string
            - type: null
          description: Date the battery was first activated/used in service.
        chargingWattage:
          anyOf:
            - type: number
            - type: null
          description: Real-time charging power in watts (W) delivered to the battery.
        chargingTier:
          anyOf:
            - type: string
              enum:
                - slow
                - standard
                - rapid
                - ultra_rapid
            - type: null
          description: "Classification of chargingWattage (under 5 W slow, 5 W up to 18 W standard, 18 W up to 30 W rapid, 30 W and above ultra_rapid). Null when no wattage was read."
        chargeLimitAvailable:
          anyOf:
            - type: boolean
            - type: null
          description: "Whether the charge_limit_available sysfs node reads \"1\"; null when it cannot be read. The node says the limit is offered, not that it is switched on."
        error:
          anyOf:
            - type: string
            - type: null
          description: Error message if battery telemetry query failed.
        source:
          $ref: "#/components/schemas/TelemetrySource"
          description: "Data provenance: 'hardware' or 'unavailable'."
      required:
        - source
    useChargingIntelligence_refresh_Request:
      type: object
      description: Request payload for refresh on useChargingIntelligence.
      properties:{}
    useChargingIntelligence_refresh_Response:
      type: object
      description: Response payload for refresh on useChargingIntelligence.
      properties:
        success:
          type: boolean
          description: Whether the hardware accepted the command.
        output:
          description: Result description
        error:
          anyOf:
            - type: string
            - type: null
