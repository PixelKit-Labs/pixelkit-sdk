    useBLETelemetry:
      type: object
      description: |
  Bluetooth adapter state, Channel Sounding, bonded devices, and active BLE peripheral discovery.

  Adapter state and the bonded device list are read from Android BluetoothAdapter through the native module (useRadios); channelSounding is whether the device declares the android.hardware.bluetooth_le.channel_sounding feature, and ranging a peer is useChannelSounding. Live peripheral discovery uses Android BluetoothLeScanner: each peripheral has its address (results without an address are skipped), name (null when neither BluetoothDevice.getName() nor the advertised local name is available), RSSI in dBm, lastSeenTimestamp (wall-clock ms computed from ScanResult.getTimestampNanos() against SystemClock.elapsedRealtimeNanos()) and estimatedDistanceMeters. The distance is derived, not measured: log-distance path loss with an assumed -59 dBm at 1 m and exponent 2. A failed scan (ScanCallback.onScanFailed) is reported in scanError with its code.
      properties:
        isSupported:
          type: boolean
          description: Whether the device has Bluetooth Low Energy.
        isEnabled:
          type: boolean
          description: Whether Bluetooth is switched on in settings.
        state:
          type: string
          enum:
            - ON
            - OFF
            - TURNING_ON
            - TURNING_OFF
          description: "Adapter state, including the transitional values."
        channelSounding:
          type: boolean
          description: Whether the device declares android.hardware.bluetooth_le.channel_sounding. Ranging itself is in useChannelSounding.
        bondedDevices:
          type: array
          items:
            $ref: "#/components/schemas/BondedDevice"
          description: Devices already paired with this phone; name is null when unnamed or BLUETOOTH_CONNECT is not granted.
        isScanning:
          type: boolean
          description: Whether a BLE scan is running.
        peripherals:
          type: array
          items:
            $ref: "#/components/schemas/BLEPeripheral"
          description: "Discovered nearby BLE peripherals: id (address), name (or null), RSSI in dBm, lastSeenTimestamp (wall-clock ms) and a derived distance estimate."
        scanError:
          anyOf:
            - type: string
            - type: null
          description: "Why the scan could not start or failed, including the ScanCallback.onScanFailed error code."
        source:
          type: string
          enum:
            - hardware
            - derived
            - unavailable
          description: "Where the numbers came from. There is no 'simulated' value: a reading is real, derived from real readings, or unavailable."
        error:
          anyOf:
            - type: string
            - type: null
          description: Latest adapter-level failure message. Failures are also logged and counted.
      required:
        - source
    useBLE_startScan_Request:
      type: object
      description: Request payload for startScan on useBLE.
      properties:
        timeoutMs:
          type: number
          description: "How long to scan before stopping automatically, in milliseconds. Defaults to 10000."
    useBLE_startScan_Response:
      type: object
      description: Response payload for startScan on useBLE.
      properties:
        success:
          type: boolean
          description: Whether the hardware accepted the command.
        output:
          description: "Resolves true when the scan started; false with the reason in scanError otherwise. Results appear in peripherals, polled every 500 ms; an asynchronous scan failure ends the scan and sets scanError."
        error:
          anyOf:
            - type: string
            - type: null
          description: Error message if failed.
        source:
          $ref: "#/components/schemas/TelemetrySource"
      required:
        - success
        - source
    useBLE_stopScan_Request:
      type: object
      description: Request payload for stopScan on useBLE.
      properties:{}
    useBLE_stopScan_Response:
      type: object
      description: Response payload for stopScan on useBLE.
      properties:
        success:
          type: boolean
          description: Whether the hardware accepted the command.
        output:
          description: "Returns nothing; a final results sync runs first, so nothing already discovered is lost."
        error:
          anyOf:
            - type: string
            - type: null
          description: Error message if failed.
        source:
          $ref: "#/components/schemas/TelemetrySource"
      required:
        - success
        - source
    useBatteryShareTelemetry:
      type: object
      description: |
  Google Pixel Battery Share (reverse wireless Qi charging) state and toggle.

  Reads the Google Pixel reverse charging sysfs node (/sys/class/power_supply/wireless/reverse_chg_mode, or /sys/devices/platform/google,battery/reverse_chg_mode): a non-zero mode means the coil is on. setBatteryShare writes that node when the app is permitted to and reports whether the write succeeded. Receiver presence, delivered watts and a charge cutoff are not exposed by any node PixelKit can read, so the hook reports none of them (transmittedWatts is always null) and offers no threshold setting.
      properties:
        isSupported:
          type: boolean
          description: Whether a readable reverse charging sysfs node exists on this device.
        isActive:
          type: boolean
          description: Whether the node reports the reverse charging coil as on (non-zero mode).
        transmittedWatts:
          anyOf:
            - type: number
            - type: null
          description: "Real-time power transmitted in watts (W), or null if inactive/unsupported."
        error:
          anyOf:
            - type: string
            - type: null
          description: Error message if reading or toggling the coil failed.
        source:
          $ref: "#/components/schemas/TelemetrySource"
          description: "Data provenance: 'hardware' or 'unavailable'."
      required:
        - source
    useBatteryShare_setBatteryShare_Request:
      type: object
      description: Request payload for setBatteryShare on useBatteryShare.
      properties:{}
    useBatteryShare_setBatteryShare_Response:
      type: object
      description: Response payload for setBatteryShare on useBatteryShare.
      properties:
        success:
          type: boolean
          description: Whether the hardware accepted the command.
        output:
          description: "Resolves true when the node write succeeded, false when the app may not write it. isActive afterwards is the re-read node value, not the request."
        error:
          anyOf:
            - type: string
            - type: null
          description: Error message if failed.
        source:
          $ref: "#/components/schemas/TelemetrySource"
      required:
        - success
        - source
