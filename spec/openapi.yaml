  Wraps the ML Kit GenAI task modules on AICore through pixel-nano: genai-summarization, genai-proofreading and genai-rewriting, plus image description. summarize, proofread and rewrite use the ML Kit task model when it is available; when it is not, or it throws, the module falls back to a Gemini Nano prompt and the result's engine field says so ('mlkit-summarization', 'mlkit-proofreading', 'mlkit-rewriting' or 'gemini-nano-prompt'). describeImage is a Gemini Nano multimodal prompt (engine 'gemini-nano-vision'). AICore decides where inference runs; the hook does not select or report the processor. Every call reports its own measured latency and the engine that served it.
