  /hooks/useEmbeddings:
    get:
      summary: On-device text embeddings from a user-supplied TFLite model (MediaPipe TextEmbedder) and cosine similarity scoring.
      description: |
  Converts text strings into dense float vectors locally for offline semantic search, deduplication, and RAG memory without server calls. Needs an embedder model file you place in the app's files directory; nothing is bundled or downloaded.

  Runs the MediaPipe Tasks TextEmbedder (TFLite) on the device CPU (XNNPACK; no TPU/NPU delegate is configured). The model is read from filesDir/models/text_embedder.tflite and must be a .tflite embedder with TFLite metadata. Vectors are L2-normalised floats whose length is the model's real output size, reported through vectorDimension. When the file is missing or fails to load the hook reports isAvailable false, source 'unavailable' and the native reason in unavailableReason; embed() rejects instead of returning an empty vector. Includes an in-memory cosine similarity helper.
      operationId: get_useEmbeddings
      tags:
        - neural-ai
      responses:
        200:
          description: Current telemetry reading from useEmbeddings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useEmbeddingsTelemetry"
  /hooks/useEmbeddings/actions/embed:
    post:
      summary: Invoke embed (useEmbeddings)
      description: Generates an embedding vector from input text; rejects rather than returning an empty vector.
      operationId: useEmbeddings_embed
      tags:
        - neural-ai
      responses:
        200:
          description: Result of invoking embed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/useEmbeddings_embed_Response"
