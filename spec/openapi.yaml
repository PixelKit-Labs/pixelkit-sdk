        rate:
          type: number
          description: Speaking speed; 1 is normal.
        pitch:
          type: number
          description: Voice pitch; 1 is normal.
        maxInputLength:
          type: number
          description: Longest string the engine accepts in one call.
        lastSpokenText:
          anyOf:
