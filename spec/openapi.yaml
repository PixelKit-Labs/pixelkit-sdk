      description: |
  Tells you whether Health Connect looks available on the device and whether the phone has a step counter and heart rate sensor. It does not read steps, heart rate or any Health Connect record.

  isAvailable and sdkStatus are inferred: the healthconnect system service (Context.HEALTHCONNECT_SERVICE, Android 14+) or the com.google.android.apps.healthdata package is present. They are not the result of HealthConnectClient.getSdkStatus(), which this SDK does not call, so no provider-update state is reported. hasStepCounter / hasHeartRateSensor and the sensor names come from the step counter system feature and SensorManager.getDefaultSensor (TYPE_STEP_COUNTER, TYPE_HEART_RATE).
