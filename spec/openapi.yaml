            - type: null
          description: "StrongBox keystore feature version (FeatureInfo.version), or null when not declared."
        hardwareKeystoreVersion:
          anyOf:
            - type: number
            - type: null
          description: "Hardware keystore feature version (FeatureInfo.version), or null when not declared."
        hasAppAttestKey:
          type: boolean
          description: Whether the device declares android.hardware.keystore.app_attest_key.
        securityModelCompatible:
