name: verify

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Behavioural: executes the capability logic that gates 19 of the 32 hooks. Everything else
      # here is static and would stay green on a wrong answer.
      - run: npm test

      # Verify that spec/openapi.json and spec/openapi.yaml match data/hooks with zero drift
      # Must run before build, so that uncommitted drift in PRs is caught before export:openapi overwrites it
      - run: npm run check-openapi

      # The three packages must compile to build/ with declarations before they can be published.
      # Also regenerates spec/openapi.json and spec/openapi.yaml via npm run export:openapi.
      - run: npm run build

      # The documentation is the contract: every exported hook has a page, every documented
      # hook still exists, and every documented return field is on the declared type. Clones
      # pixelkit-docs, so a rename here that makes a page wrong fails this build.
      - run: npm run check-docs

      # On PRs: ensure that build didn't generate any uncommitted drift in spec/
      - name: Verify spec has no uncommitted drift
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain spec/)" ]; then
            echo "::error::OpenAPI specification is out of date! Run 'npm run export:openapi' and commit the updated spec/ files."
            git diff spec/
            exit 1
          fi

      # Automatically commit and push updated OpenAPI spec if drift was generated on master
      - name: Auto-sync OpenAPI specification
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          if [ -n "$(git status --porcelain spec/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add spec/
            git commit -m "chore: auto-sync openapi specification [skip ci]"
            git push
          else
            echo "OpenAPI specification is in sync."
          fi

      - run: npm pack --dry-run -w @pixelkit-labs/sdk -w @pixelkit-labs/native -w @pixelkit-labs/mlkit

      # The subpath entry only pays off if it resolves. Pack, install into a scratch project, and
      # resolve both entries through the exports map.
      #
      # Three things this step has to get right, each of which broke it before:
      #   - pixelkit pins @pixelkit-labs/native by exact version, and that version is not on the registry
      #     until the release workflow runs, so the local tarball has to satisfy the dependency.
      #   - npm pack names a scoped tarball after the full name, so it is pixelkit-labs-sdk-*.tgz
      #     and pixelkit-labs-native-*.tgz; the filenames must be exact.
      #   - the scratch project has no react/react-native/expo, so full peer resolution cannot
      #     succeed. --legacy-peer-deps skips it, which is right here: this checks packaging, not
      #     whether an app builds. Scripts are skipped for the same reason.
      #
      # No `|| true` anywhere. A failed install must fail the build, not surface later as a
      # confusing "main entry missing".
      - name: A consumer can import both entries
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          npm pack -w @pixelkit-labs/native --pack-destination /tmp
          npm pack -w @pixelkit-labs/sdk --pack-destination /tmp
          mkdir -p /tmp/consumer && cd /tmp/consumer && npm init -y >/dev/null
          npm install "/tmp/pixelkit-labs-native-$version.tgz" "/tmp/pixelkit-labs-sdk-$version.tgz" \
            --legacy-peer-deps --ignore-scripts
          node -e "
            for (const id of ['@pixelkit-labs/sdk', '@pixelkit-labs/sdk/mlkit']) {
              require.resolve(id);
              console.log(id, 'resolves');
            }
          "
          test -f node_modules/@pixelkit-labs/sdk/mlkit.js || { echo "mlkit shim missing"; exit 1; }
          echo "both entries resolve, and the shim for bundlers without exports support is present"
