name: release

# Publishes all three packages when a version tag is pushed. This is the event the rest of the
# project reacts to: npm gets the new version, Dependabot opens a pull request on the template
# within a day, and that PR's parity check decides whether the new SDK is demonstrable there.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and validate without publishing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run typecheck

      # A release must not ship logic that has not been run.
      - run: npm test
      - run: npm run build

      # The tag and the manifests must agree. A tag that does not match ships a version nobody
      # asked for, and npm will not let you take it back.
      - name: Tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(node -p "require('./package.json').version")
          test "$tag" = "$pkg" || { echo "tag v$tag does not match package version $pkg"; exit 1; }
          for p in sdk native mlkit; do
            v=$(node -p "require('./packages/$p/package.json').version")
            test "$v" = "$pkg" || { echo "packages/$p is $v, expected $pkg — run npm run sync-versions"; exit 1; }
          done
          echo "all four manifests at $pkg"

      - run: npm pack --dry-run -w @pixelkit-labs/sdk -w @pixelkit-labs/native -w @pixelkit-labs/mlkit

      # Order matters: pixelkit pins the other two by exact version, so they must exist on the
      # registry first or its own install resolves against nothing.
      - name: Publish
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: |
          npm publish -w @pixelkit-labs/native --provenance --access public
          npm publish -w @pixelkit-labs/mlkit  --provenance --access public
          npm publish -w @pixelkit-labs/sdk         --provenance --access public
        env:
          # Repository secret PIXELKIT: an npm granular access token with read and write on the
          # @pixelkit-labs scope and the unscoped pixelkit package. Named PIXELKIT rather than
          # NPM_TOKEN because that is how it was created; the value is what matters, not the name.
          NODE_AUTH_TOKEN: ${{ secrets.PIXELKIT }}
