plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.pixelkit'
version = '0.1.0'

android {
  namespace "expo.modules.pixelnano"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // ML Kit GenAI Prompt API (Gemini Nano through AICore). beta4 = Nano v4 + streaming fixes.
  implementation "com.google.mlkit:genai-prompt:1.0.0-beta4"
  implementation "com.google.mlkit:genai-summarization:1.0.0-beta1"
  implementation "com.google.mlkit:genai-proofreading:1.0.0-beta1"
  implementation "com.google.mlkit:genai-rewriting:1.0.0-beta1"

  // ML Kit Vision APIs
  implementation "com.google.mlkit:barcode-scanning:17.3.0"
  implementation "com.google.mlkit:face-detection:16.1.7"
  implementation "com.google.mlkit:face-mesh-detection:16.0.0-beta3"
  implementation "com.google.mlkit:text-recognition:16.0.1"
  implementation "com.google.mlkit:image-labeling:17.0.9"
  implementation "com.google.mlkit:object-detection:17.0.2"
  implementation "com.google.mlkit:digital-ink-recognition:18.1.0"
  implementation "com.google.mlkit:pose-detection:18.0.0-beta5"
  implementation "com.google.mlkit:segmentation-selfie:16.0.0-beta6"
  implementation "com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1"
  implementation "com.google.android.gms:play-services-mlkit-document-scanner:16.0.0-beta1"

  // ML Kit Natural Language APIs
  implementation "com.google.mlkit:language-id:17.0.6"
  implementation "com.google.mlkit:translate:17.0.3"
  implementation "com.google.mlkit:smart-reply:17.0.4"
  implementation "com.google.mlkit:entity-extraction:16.0.0-beta5"

  // MediaPipe Tasks TextEmbedder: runs the user-supplied filesDir/models/text_embedder.tflite (TFLite metadata required).
  implementation "com.google.mediapipe:tasks-text:0.10.35"
}

// genai-prompt 1.0.0-beta4 is compiled with Kotlin 2.3 (metadata 2.3.0). Expo 57 builds with the
// Kotlin version from React Native's version catalog (2.1.20), which only reads metadata up to 2.2.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
  compilerOptions.freeCompilerArgs.add("-Xskip-metadata-version-check")
}

// genai-prompt depends on kotlin-stdlib 2.3.21. Left alone, Gradle would raise the app's stdlib to 2.3.21
// and the app module's Kotlin compile would fail on the newer metadata. Pin every kotlin-stdlib artifact
// in the build to the project's Kotlin version. ML Kit's stdlib usage was checked against 2.1.20.
rootProject.allprojects { p ->
  p.configurations.configureEach { c ->
    c.resolutionStrategy.eachDependency { d ->
      if (d.requested.group == 'org.jetbrains.kotlin' && d.requested.name.startsWith('kotlin-stdlib')) {
        d.useVersion(rootProject.ext.kotlinVersion)
        d.because('pixel-nano: ML Kit GenAI pulls kotlin-stdlib 2.3.21; project compiles with Kotlin ' + rootProject.ext.kotlinVersion)
      }
    }
  }
}
